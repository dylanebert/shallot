# Prebuilt shallot-window shell release pipeline.
#
# This is the repo's first CI. It produces the prebuilt binary archives that `shallot build --target`
# downloads when available (stage B's `tryPrebuilt` in bin/native.ts), falling back to lazy compile on
# any miss. One `shallot-window-<triple>-<mode>.tar.gz` per matrix cell, plus a top-level `SHA256SUMS`
# covering all six.
#
# TRIGGER ASYMMETRY — the dry run's whole safety property:
#   • push to tag v*  → builds, assembles, AND attaches archives + SHA256SUMS to the GitHub Release.
#   • workflow_dispatch → builds and assembles the SAME archives, but uploads them as RUN ARTIFACTS
#     only. A dispatch run MUST NOT create, mutate, or upload to any release. The release-upload
#     step (below, in the `checksums` job) carries `if: startsWith(github.ref, 'refs/tags/v')' so a
#     dispatch run (whose github.ref is a branch ref, never a tag) cannot reach it. Do NOT remove that
#     gate — it is the only thing keeping a dry run from publishing.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# First-party actions on major tags, deliberately. SHA pinning is owed to a seat that can verify
# the SHAs (this seat's network is fenced, and an unverifiable hand-written SHA is a harder
# failure than a first-party mutable tag — the action fails to resolve at all).

permissions:
  contents: read # write is granted only on the checksums job that carries the tag-gated upload

concurrency:
  # Keyed on the ref so two tag pushes (or a re-run racing its original) cannot both attach
  # assets to one release. Do not cancel in-progress for tag runs — a cancelled build mid-upload
  # could leave a half-attached release.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# D1 fix: Windows runners default `run:` steps to PowerShell, but every body in this workflow is
# bash. A single workflow-level default covers every `run:` step so no step can forget it — rather
# than a per-step `shell:` sprinkle. Bash is present on the Windows runner (Git Bash).
defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu → linux (x86_64-unknown-linux-gnu)
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            mode: system
            binary: shallot-window
            archive: shallot-window-x86_64-unknown-linux-gnu-system.tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            mode: portable
            binary: shallot-window
            archive: shallot-window-x86_64-unknown-linux-gnu-portable.tar.gz
          # windows → windows (x86_64-pc-windows-msvc)
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            mode: system
            binary: shallot-window.exe
            archive: shallot-window-x86_64-pc-windows-msvc-system.tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            mode: portable
            binary: shallot-window.exe
            archive: shallot-window-x86_64-pc-windows-msvc-portable.tar.gz
          # macos-14 (Apple Silicon) → mac (aarch64-apple-darwin)
          - target: aarch64-apple-darwin
            runner: macos-14
            mode: system
            binary: shallot-window
            archive: shallot-window-aarch64-apple-darwin-system.tar.gz
          - target: aarch64-apple-darwin
            runner: macos-14
            mode: portable
            binary: shallot-window
            archive: shallot-window-aarch64-apple-darwin-portable.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      # First-party actions on major tags, deliberately (see comment at top of file).
      - uses: actions/checkout@v4

      # GitHub runners ship rustup + a stable Rust toolchain preinstalled; only the cross-compile
      # target may need adding. No third-party rust setup action.
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      # D2/D3 fix: the Linux system build (wry → WebKitGTK) needs glib/GTK dev headers discoverable
      # by pkg-config, and the Linux portable build (CEF) needs X11 dev headers to link -lX11. The
      # README documents "WebKitGTK dev headers" for the system build (README § native build
      # prerequisites); the X11 dev headers for the portable build are NOT documented there (the README
      # only names the CEF runtime download) and were derived from the -lX11 link failure. Gates to
      # Linux only — mac and Windows are green and must not grow an install step.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            g++ \
            pkg-config

      - name: Build shallot-window shell (release)
        working-directory: packages/shallot/rust/window
        run: |
          if [ "${{ matrix.mode }}" = "portable" ]; then
            cargo build --release --target ${{ matrix.target }} --no-default-features --features portable
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      # Assemble the archive per the pinned contract:
      #   system       → shallot-window[.exe]
      #   linux/win portable → shallot-window[.exe] + cef/ (copyCefLibs/copyCefDlls file sets)
      #   mac portable → shallot-window + shallot-helper + Chromium Embedded Framework.framework/
      # The CEF runtime is discovered via the same findCefDir search pattern native.ts uses
      # (target/<triple>/release/build/cef-dll-sys-*/out/<subdir>/), NOT by re-deriving the CDN URL.
      - name: Assemble archive
        env:
          TARGET: ${{ matrix.target }}
          MODE: ${{ matrix.mode }}
          BINARY: ${{ matrix.binary }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -e
          CRATE="packages/shallot/rust/window"
          STAGE="stage"
          mkdir -p "$STAGE"

          # Copy the shell binary.
          cp "$CRATE/target/$TARGET/release/$BINARY" "$STAGE/"

          if [ "$MODE" = "portable" ]; then
            if echo "$TARGET" | grep -q darwin; then
              # macOS: CEF framework is a directory (mirrors findCefDir marker CEF_FRAMEWORK).
              CEF_DIR=$(find "$CRATE/target/$TARGET/release/build" \
                -path "*/cef-dll-sys-*/out/*" \
                -name "Chromium Embedded Framework.framework" \
                -print -quit 2>/dev/null | head -1)
              if [ -z "$CEF_DIR" ]; then
                echo "CEF framework not found under $CRATE/target/$TARGET/release/build" >&2
                exit 1
              fi

              # Copy the helper binary (mac-portable only, per the archive contract).
              cp "$CRATE/target/$TARGET/release/shallot-helper" "$STAGE/"

              # ditto preserves symlinks/perms/xattrs — canonical for copying a macOS framework.
              ditto "$CEF_DIR" "$STAGE/Chromium Embedded Framework.framework"

              # Trim non-English locales (mirrors trimMacLocales in native.ts).
              RES="$STAGE/Chromium Embedded Framework.framework/Resources"
              if [ -d "$RES" ]; then
                for lproj in "$RES"/*.lproj; do
                  base="$(basename "$lproj")"
                  if [ "$base" != "en.lproj" ] && [ "$base" != "en_US.lproj" ]; then
                    rm -rf "$lproj"
                  fi
                done
                if [ -d "$RES/locales" ]; then
                  for pak in "$RES/locales"/*.pak; do
                    base="$(basename "$pak")"
                    if [ "$base" != "en-US.pak" ]; then
                      rm -f "$pak"
                    fi
                  done
                fi
              fi

              # Strip the framework binary (release only; -x -S keeps external symbols for dylib load).
              strip -x -S "$STAGE/Chromium Embedded Framework.framework/Chromium Embedded Framework" 2>/dev/null || true

            elif echo "$TARGET" | grep -q windows; then
              # Windows: CEF files in cef/ subdir (consumer's buildPrebuiltResult expects cef/).
              MARKER=$(find "$CRATE/target/$TARGET/release/build" \
                -path "*/cef-dll-sys-*/out/*" \
                -name "libcef.dll" \
                -print -quit 2>/dev/null | head -1)
              if [ -z "$MARKER" ]; then
                echo "libcef.dll not found under $CRATE/target/$TARGET/release/build" >&2
                exit 1
              fi
              CEF_DIR="$(dirname "$MARKER")"
              mkdir -p "$STAGE/cef"

              # copyCefDlls file set (native.ts).
              for f in \
                libcef.dll chrome_elf.dll d3dcompiler_47.dll dxcompiler.dll dxil.dll \
                libEGL.dll libGLESv2.dll vulkan-1.dll icudtl.dat snapshot_blob.bin \
                v8_context_snapshot.bin chrome_100_percent.pak chrome_200_percent.pak \
                resources.pak vk_swiftshader.dll vk_swiftshader_icd.json; do
                [ -f "$CEF_DIR/$f" ] && cp "$CEF_DIR/$f" "$STAGE/cef/"
              done

              # Active locale only (copyLocale: en-US.pak).
              mkdir -p "$STAGE/cef/locales"
              [ -f "$CEF_DIR/locales/en-US.pak" ] && cp "$CEF_DIR/locales/en-US.pak" "$STAGE/cef/locales/"

            else
              # Linux: CEF files in cef/ subdir (consumer's buildPrebuiltResult expects cef/).
              MARKER=$(find "$CRATE/target/$TARGET/release/build" \
                -path "*/cef-dll-sys-*/out/*" \
                -name "libcef.so" \
                -print -quit 2>/dev/null | head -1)
              if [ -z "$MARKER" ]; then
                echo "libcef.so not found under $CRATE/target/$TARGET/release/build" >&2
                exit 1
              fi
              CEF_DIR="$(dirname "$MARKER")"
              mkdir -p "$STAGE/cef"

              # copyCefLibs file set (native.ts).
              for f in \
                libcef.so libEGL.so libGLESv2.so libvulkan.so.1 icudtl.dat \
                v8_context_snapshot.bin chrome-sandbox chrome_100_percent.pak \
                chrome_200_percent.pak resources.pak libvk_swiftshader.so; do
                [ -f "$CEF_DIR/$f" ] && cp "$CEF_DIR/$f" "$STAGE/cef/"
              done

              # Active locale only (copyLocale: en-US.pak).
              mkdir -p "$STAGE/cef/locales"
              [ -f "$CEF_DIR/locales/en-US.pak" ] && cp "$CEF_DIR/locales/en-US.pak" "$STAGE/cef/locales/"

              # SwiftShader dir (copyCefLibs copies it when not dropped).
              if [ -d "$CEF_DIR/swiftshader" ]; then
                cp -r "$CEF_DIR/swiftshader" "$STAGE/cef/"
              fi

              # Strip libcef.so (release only).
              strip "$STAGE/cef/libcef.so" 2>/dev/null || true
            fi
          fi

          # Pack the archive.
          tar -czf "$ARCHIVE" -C "$STAGE" .

      # Always upload as a run artifact — both tag and dispatch runs do this.
      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  # Final job: collect all six archives, generate SHA256SUMS, and (tag only) attach to the release.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed only by the tag-gated release-upload step below
    steps:
      # First-party actions on major tags, deliberately (see comment at top of file).
      - uses: actions/download-artifact@v4
        with:
          path: archives
          pattern: shallot-window-*.tar.gz
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd archives
          sha256sum shallot-window-*.tar.gz > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Upload SHA256SUMS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: SHA256SUMS

      # TAG-ONLY: attach archives + SHA256SUMS to the GitHub Release.
      # The if: gate is the dry-run safety property — a workflow_dispatch run's github.ref is a
      # branch ref (refs/heads/<branch>), never refs/tags/v*, so this step is skipped on dispatch.
      # Do NOT remove or broaden this condition.
      #
      # CREATE-IF-MISSING: shallot's release procedure (testing.md § Release gate) ends at
      # publish + push tag — it never creates a GitHub Release object. So on the first tag push
      # there is no Release to upload into; `gh release upload` alone would fail "release not
      # found". The step branches on `gh release view` (an explicit branch, not a `||` chain
      # that would swallow an unrelated failure): if the Release is absent it is created with
      # --verify-tag (the tag is guaranteed present — the workflow is tag-triggered) and
      # --generate-notes, attaching the archives at creation; if it already exists the upload
      # uses --clobber so a re-run after a partial upload converges instead of erroring on the
      # first already-present asset.
      #
      # Uses `gh` (preinstalled on GitHub runners) rather than a third-party action. The glob
      # `archives/shallot-window-*.tar.gz` makes a zero-match an error: bash passes the unmatched
      # literal to gh, which fails because the file does not exist — so a partial assembly cannot
      # publish a SHA256SUMS with no archives beside it.
      #
      # GH_REPO, not a checkout: the checksums job's only inputs are the downloaded build artifacts
      # — it has no source tree and needs none. `gh` with no repo context fails "fatal: not a git
      # repository" (run 32543662094), and that failure hits *both* branches of the step: `gh
      # release view` fails identically, which is why the run took the else branch at all. One env
      # line — `GH_REPO: ${{ github.repository }}` — lets `gh` resolve the repo from the env and
      # then verify the tag against the *remote* API rather than a local clone (gh manual:
      # `--verify-tag` aborts when the tag doesn't exist in the *remote* repository). So the guard
      # stays: dropping `--verify-tag` would only address the sub-command the error was reported
      # against and leave the branch predicate broken. No `actions/checkout` step is added — the
      # job's only inputs are downloaded artifacts, and a clone would be dead weight that reintroduces
      # the git dependency the env line removes.
      - name: Attach archives to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" --clobber \
              archives/shallot-window-*.tar.gz \
              SHA256SUMS
          else
            gh release create "${{ github.ref_name }}" --verify-tag --generate-notes \
              archives/shallot-window-*.tar.gz \
              SHA256SUMS
          fi
