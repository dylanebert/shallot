# Prebuilt shallot-native shell release pipeline.
#
# This is the repo's first CI. It produces the prebuilt binary archives that `shallot build --target`
# downloads when available (stage B's `tryPrebuilt` in src/native/prebuilt.ts), falling back to lazy compile on
# any miss. One `shallot-native-<triple>-<mode>.tar.gz` per matrix cell, plus a top-level `SHA256SUMS`
# covering all six.
#
# TRIGGER ASYMMETRY — the dry run's whole safety property:
#   • push to tag v*  → builds, assembles, AND attaches archives + SHA256SUMS to the GitHub Release.
#   • workflow_dispatch → builds and assembles the SAME archives, but uploads them as RUN ARTIFACTS
#     only. A dispatch run MUST NOT create, mutate, or upload to any release. The release-upload
#     step requires both a push event and a release tag ref, so dispatch at a branch or tag
#     cannot publish.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# First-party actions on major tags, deliberately. SHA pinning is owed to a seat that can verify
# the SHAs (this seat's network is fenced, and an unverifiable hand-written SHA is a harder
# failure than a first-party mutable tag — the action fails to resolve at all).

permissions:
  contents: read # write is granted only on the checksums job that carries the tag-gated upload

concurrency:
  # Keyed on the ref so two tag pushes (or a re-run racing its original) cannot both attach
  # assets to one release. Do not cancel in-progress for tag runs — a cancelled build mid-upload
  # could leave a half-attached release.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# D1 fix: Windows runners default `run:` steps to PowerShell, but every body in this workflow is
# bash. A single workflow-level default covers every `run:` step so no step can forget it — rather
# than a per-step `shell:` sprinkle. Bash is present on the Windows runner (Git Bash).
defaults:
  run:
    shell: bash

jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu → linux (x86_64-unknown-linux-gnu)
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            mode: system
            binary: shallot-native
            archive: shallot-native-x86_64-unknown-linux-gnu-system.tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            mode: portable
            binary: shallot-native
            archive: shallot-native-x86_64-unknown-linux-gnu-portable.tar.gz
          # windows → windows (x86_64-pc-windows-msvc)
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            mode: system
            binary: shallot-native.exe
            archive: shallot-native-x86_64-pc-windows-msvc-system.tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            mode: portable
            binary: shallot-native.exe
            archive: shallot-native-x86_64-pc-windows-msvc-portable.tar.gz
          # macos-15 (Apple Silicon) → mac (aarch64-apple-darwin)
          - target: aarch64-apple-darwin
            runner: macos-15
            mode: system
            binary: shallot-native
            archive: shallot-native-aarch64-apple-darwin-system.tar.gz
          - target: aarch64-apple-darwin
            runner: macos-15
            mode: portable
            binary: shallot-native
            archive: shallot-native-aarch64-apple-darwin-portable.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      # First-party actions on major tags, deliberately (see comment at top of file).
      - uses: actions/checkout@v7

      # GitHub runners ship rustup + a stable Rust toolchain preinstalled; only the cross-compile
      # target may need adding. No third-party rust setup action.
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      # D2/D3 fix: the Linux system build (wry → WebKitGTK) needs glib/GTK dev headers discoverable
      # by pkg-config, and the Linux portable build (CEF) needs X11 dev headers to link -lX11. The
      # README documents "WebKitGTK dev headers" for the system build (README § native build
      # prerequisites); the X11 dev headers for the portable build are NOT documented there (the README
      # only names the CEF runtime download) and were derived from the -lX11 link failure. Gates to
      # Linux only — mac and Windows are green and must not grow an install step.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            g++ \
            pkg-config

      - name: Build shallot-native shell (release)
        working-directory: crates/native
        env:
          SHALLOT_ASSETS: disk
        run: |
          if [ "${{ matrix.mode }}" = "portable" ]; then
            cargo build --release --target-dir target --target ${{ matrix.target }} --no-default-features --features portable --message-format=json-render-diagnostics > ../../cargo-messages.json
          else
            cargo build --release --target-dir target --target ${{ matrix.target }} --message-format=json-render-diagnostics > ../../cargo-messages.json
          fi

      # Assemble the archive per the pinned contract:
      #   system       → shallot-native[.exe]
      #   linux/win portable → shallot-native[.exe] + cef/ (copyCefLibs/copyCefDlls file sets)
      #   mac portable → shallot-native + shallot-helper + Chromium Embedded Framework.framework/
      # The selected Cargo build-script result names the CEF runtime, including on cache hits.
      - name: Assemble archive
        env:
          TARGET: ${{ matrix.target }}
          MODE: ${{ matrix.mode }}
          BINARY: ${{ matrix.binary }}
          ARCHIVE: ${{ matrix.archive }}
        run: bash scripts/assemble-native-archive.sh

      # Always upload as a run artifact — both tag and dispatch runs do this.
      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  # Final job: collect all six archives, generate SHA256SUMS, and (tag only) attach to the release.
  checksums:
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed only by the tag-gated release-upload step below
    steps:
      # First-party actions on major tags, deliberately (see comment at top of file).
      - uses: actions/download-artifact@v8
        with:
          path: archives
          pattern: shallot-native-*.tar.gz
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd archives
          sha256sum shallot-native-*.tar.gz > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Upload SHA256SUMS artifact
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: SHA256SUMS

      # Do not broaden this guard: dispatch must never publish, even at a release tag.
      # New releases use tagged changelog copy; asset retries preserve existing notes.
      # GH_REPO supplies context without a checkout; --verify-tag requires a remote tag.
      - name: Attach archives to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" --clobber \
              archives/shallot-native-*.tar.gz \
              SHA256SUMS
          else
            gh api "repos/$GH_REPO/contents/CHANGELOG.md" \
              -H 'Accept: application/vnd.github.raw+json' \
              -X GET -f ref="$RELEASE_TAG" > tagged-changelog.md
            awk -v heading="## ${RELEASE_TAG#v}" '
              /^## / { if (selected) exit; selected = ($0 == heading); next }
              selected { print }
            ' tagged-changelog.md > release-notes.md
            if ! grep -q '[^[:space:]]' release-notes.md; then
              echo "Missing or empty changelog entry for $RELEASE_TAG" >&2
              exit 1
            fi
            release_args=(--verify-tag --notes-file release-notes.md)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${release_args[@]}" \
              archives/shallot-native-*.tar.gz \
              SHA256SUMS
          fi
