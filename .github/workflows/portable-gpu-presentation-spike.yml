name: temporary portable GPU presentation spike

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  presentation-spike:
    if: github.head_ref == 'unit/portable-tiers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: capture runner image
        id: runner-image
        run: echo "image=${ImageOS:?GitHub-hosted runner must set ImageOS}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: cache
        with:
          path: ~/.cache/mesa-apt
          key: mesa-vulkan-${{ steps.runner-image.outputs.image }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/test.yml') }}
      - name: install Mesa Vulkan driver
        run: |
          apt_cache="$HOME/.cache/mesa-apt"
          mkdir -p "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          sudo chown _apt:root "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          apt_options=(-o Dir::Cache::archives="$apt_cache/archives" -o Dir::State::lists="$apt_cache/lists")
          if [[ "${{ steps.cache.outputs.cache-hit }}" == 'true' ]]; then
            sudo apt-get "${apt_options[@]}" install --no-download -y mesa-vulkan-drivers
          else
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y mesa-vulkan-drivers
          fi
          sudo chmod -R a+rX "$apt_cache"
          dpkg-query -W -f='mesa-vulkan-drivers=${Version}\n' mesa-vulkan-drivers
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: install Playwright Chromium
        run: bunx playwright install chromium
      - name: run the no-Shallot presentation variants
        run: /usr/bin/time -p bun scripts/portable-gpu-presentation-spike/variants.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: portable-gpu-presentation-${{ github.run_id }}
          path: .artifacts/portable-gpu-presentation
          if-no-files-found: warn
          retention-days: 14
