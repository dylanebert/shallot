name: test-surface

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  ubuntu:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: rustup toolchain install 1.98.1 --target wasm32-unknown-unknown
      - run: rustup toolchain install nightly-2026-09-10 --component rust-src --target wasm32-unknown-unknown
      - run: bun run build
      - run: bun run check
      - run: bun run test
  macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: rustup toolchain install 1.98.1 --target wasm32-unknown-unknown
      - run: rustup toolchain install nightly-2026-09-10 --component rust-src --target wasm32-unknown-unknown
      - run: bun run build
      - run: bun run check
      - run: bun run test
  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: rustup toolchain install 1.98.1 --target wasm32-unknown-unknown
      - run: rustup toolchain install nightly-2026-09-10 --component rust-src --target wasm32-unknown-unknown
      - run: bun run build
      - run: bun run check
      - run: bun run test
