name: test-surface

on: [push, pull_request]

jobs:
  surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run test:integration -- --base ${{ github.event.pull_request.base.sha || github.event.before }} --diff ${{ github.sha }}
