name: Windows browser diagnostic

on:
  push:
    branches:
      - spike/windows

jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: install Playwright Chromium
        run: bunx playwright install chromium
      - name: packed-capture cleanup trace
        run: bunx playwright test -c scripts/packed-capture --trace on
      - name: identify open Windows handles
        if: always()
        shell: pwsh
        run: ./scripts/windows-packed-capture-locks.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-packed-capture-trace
          path: test-results/
