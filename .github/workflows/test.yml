name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: resolve surface refs
        env:
          SURFACE_EVENT: ${{ github.event_name }}
          SURFACE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          SURFACE_BEFORE: ${{ github.event.before }}
          SURFACE_DIFF: ${{ github.sha }}
          SURFACE_REF: ${{ github.ref }}
          SURFACE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$SURFACE_EVENT" = "pull_request" ]; then
            base="$SURFACE_PR_BASE"
          elif [ -n "$SURFACE_BEFORE" ] && [ "$SURFACE_BEFORE" != "$zero" ]; then
            base="$SURFACE_BEFORE"
          elif [ "$SURFACE_REF" = "refs/heads/$SURFACE_DEFAULT_BRANCH" ]; then
            base="$(git rev-parse --verify --quiet --end-of-options "$SURFACE_DIFF^")" || {
              echo "surface refused: the initial default-branch push has no parent commit" >&2
              exit 1
            }
          else
            base="$(git merge-base "$SURFACE_DIFF" "origin/$SURFACE_DEFAULT_BRANCH")" || {
              echo "surface refused: could not derive a merge base for the new branch push" >&2
              exit 1
            }
          fi
          git rev-parse --verify --quiet --end-of-options "$base^{commit}" >/dev/null || {
            echo "surface refused: base is not an existing commit object: $base" >&2
            exit 1
          }
          git rev-parse --verify --quiet --end-of-options "$SURFACE_DIFF^{commit}" >/dev/null || {
            echo "surface refused: diff is not an existing commit object: $SURFACE_DIFF" >&2
            exit 1
          }
          echo "surface refs: base=$base diff=$SURFACE_DIFF"
          echo "SHALLOT_SURFACE_BASE=$base" >> "$GITHUB_ENV"
          echo "SHALLOT_SURFACE_DIFF=$SURFACE_DIFF" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: static gates
        if: always()
        run: bun run check
      - name: unit sweep
        if: always()
        run: |
          rm -rf .artifacts
          bun run test
      - name: upload unit sweep artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shallot-test-${{ runner.os }}-unit-sweep-${{ github.run_id }}
          path: .artifacts/
          if-no-files-found: warn
          include-hidden-files: true
      - name: changed integration rows without GPU requirements
        if: always()
        run: |
          rm -rf .artifacts
          bun run test -- --integration --base "$SHALLOT_SURFACE_BASE" --diff "$SHALLOT_SURFACE_DIFF" --requires '!gpu' --requires '!browser' --no-unit-fallback
      - name: upload changed CPU integration artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shallot-test-${{ runner.os }}-cpu-integration-${{ github.run_id }}
          path: .artifacts/
          if-no-files-found: warn
          include-hidden-files: true

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: resolve surface refs
        env:
          SURFACE_EVENT: ${{ github.event_name }}
          SURFACE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          SURFACE_BEFORE: ${{ github.event.before }}
          SURFACE_DIFF: ${{ github.sha }}
          SURFACE_REF: ${{ github.ref }}
          SURFACE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$SURFACE_EVENT" = "pull_request" ]; then
            base="$SURFACE_PR_BASE"
          elif [ -n "$SURFACE_BEFORE" ] && [ "$SURFACE_BEFORE" != "$zero" ]; then
            base="$SURFACE_BEFORE"
          elif [ "$SURFACE_REF" = "refs/heads/$SURFACE_DEFAULT_BRANCH" ]; then
            base="$(git rev-parse --verify --quiet --end-of-options "$SURFACE_DIFF^")" || {
              echo "surface refused: the initial default-branch push has no parent commit" >&2
              exit 1
            }
          else
            base="$(git merge-base "$SURFACE_DIFF" "origin/$SURFACE_DEFAULT_BRANCH")" || {
              echo "surface refused: could not derive a merge base for the new branch push" >&2
              exit 1
            }
          fi
          git rev-parse --verify --quiet --end-of-options "$base^{commit}" >/dev/null || {
            echo "surface refused: base is not an existing commit object: $base" >&2
            exit 1
          }
          git rev-parse --verify --quiet --end-of-options "$SURFACE_DIFF^{commit}" >/dev/null || {
            echo "surface refused: diff is not an existing commit object: $SURFACE_DIFF" >&2
            exit 1
          }
          echo "surface refs: base=$base diff=$SURFACE_DIFF"
          echo "SHALLOT_SURFACE_BASE=$base" >> "$GITHUB_ENV"
          echo "SHALLOT_SURFACE_DIFF=$SURFACE_DIFF" >> "$GITHUB_ENV"
      - name: install Bun dependencies, including bun-webgpu
        run: bun install --frozen-lockfile
      - name: install Playwright Chromium
        run: bunx playwright install chromium
      - name: changed GPU integration rows
        if: always()
        run: |
          rm -rf .artifacts
          bun run test -- --integration --base "$SHALLOT_SURFACE_BASE" --diff "$SHALLOT_SURFACE_DIFF" --requires gpu --requires '!browser' --no-unit-fallback
      - name: upload changed GPU integration artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shallot-test-${{ runner.os }}-gpu-integration-${{ github.run_id }}
          path: .artifacts/
          if-no-files-found: warn
          include-hidden-files: true
      - name: changed browser integration rows
        if: always()
        run: |
          rm -rf .artifacts
          bun run test -- --integration --base "$SHALLOT_SURFACE_BASE" --diff "$SHALLOT_SURFACE_DIFF" --requires browser --no-unit-fallback
      - name: upload changed browser integration artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shallot-test-${{ runner.os }}-browser-integration-${{ github.run_id }}
          path: .artifacts/
          if-no-files-found: warn
          include-hidden-files: true
