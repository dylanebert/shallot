name: test

on:
  push:
    branches:
      - main
      - ci/engine-gpu-core
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cheap:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: install dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: static gates
        run: bun run check
      - name: cheap tier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: /usr/bin/time -p bun run test --path-ignore-patterns '**/*.gpu.test.ts'

  gpu:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: GPU tier
        run: /usr/bin/time -p bun scripts/gpu-compile.oracle.ts

  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: audio tests
        run: /usr/bin/time -p cargo test -p shallot-audio
      - name: physics tests
        run: /usr/bin/time -p cargo test -p shallot-physics

  node:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - name: Node tier
        run: /usr/bin/time -p bun test $(find ./src ./examples ./scripts ./diagnostics -name '*.node.ts' -print)
      - name: compile time oracle
        run: bun test ./scripts/compile.oracle.ts

  browser:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: install Playwright Chromium
        run: bunx playwright install chromium
      - name: browser tier
        run: /usr/bin/time -p bun run test:browser
