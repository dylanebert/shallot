name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cheap:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: install dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: static gates
        run: bun run check
      - name: cheap tier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: time -p bun run test --path-ignore-patterns '**/*.gpu.test.ts' --path-ignore-patterns '**/*.test.node.ts'

  gpu:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: capture runner image
        id: runner-image
        if: matrix.os == 'ubuntu-latest'
        run: echo "image=${ImageOS:?GitHub-hosted runner must set ImageOS}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        if: matrix.os == 'ubuntu-latest'
        id: cache
        with:
          path: ~/.cache/mesa-apt
          key: mesa-vulkan-${{ steps.runner-image.outputs.image }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/test.yml') }}
      - name: install Mesa Vulkan driver
        if: matrix.os == 'ubuntu-latest'
        run: |
          apt_cache="$HOME/.cache/mesa-apt"
          mkdir -p "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          sudo chown _apt:root "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          apt_options=(-o Dir::Cache::archives="$apt_cache/archives" -o Dir::State::lists="$apt_cache/lists")
          if [[ "${{ steps.cache.outputs.cache-hit }}" == 'true' ]]; then
            sudo apt-get "${apt_options[@]}" install --no-download -y mesa-vulkan-drivers
          else
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y mesa-vulkan-drivers
          fi
          sudo chmod -R a+rX "$apt_cache"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Run Bun as node.exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $hostDir = Join-Path $env:RUNNER_TEMP 'bun-node'
          New-Item -ItemType Directory -Force -Path $hostDir | Out-Null
          Copy-Item (Get-Command bun).Source (Join-Path $hostDir 'node.exe')
          Add-Content -Path $env:GITHUB_PATH -Value $hostDir
          Write-Output "Bun node.exe host: $hostDir"
      - name: Identify WARP adapter
        if: matrix.os == 'windows-latest'
        run: node -e "import('webgpu').then(({ create, globals }) => { Object.assign(globalThis, globals); return create([]).requestAdapter(); }).then((adapter) => { if (!adapter) throw new Error('WARP adapter unavailable'); const info = adapter.info; const identity = [info.vendor, info.architecture, info.device, info.description].join(' '); if (!/warp|basic render/i.test(identity)) throw new Error('Expected WARP, got ' + identity); console.info('WARP adapter:', identity); })"
      - name: GPU tier
        if: matrix.os != 'windows-latest'
        run: /usr/bin/time -p bun scripts/gpu-compile.oracle.ts
      - name: GPU tier on WARP
        if: matrix.os == 'windows-latest'
        run: time -p node scripts/gpu-compile.oracle.ts

  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: audio tests
        run: /usr/bin/time -p cargo test -p shallot-audio
      - name: physics tests
        run: /usr/bin/time -p cargo test -p shallot-physics

  node:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            shard: 1/2
          - os: macos-15
            shard: 2/2
          - os: ubuntu-latest
            shard: 1/2
          - os: ubuntu-latest
            shard: 2/2
          - os: windows-latest
            shard: 1/1
    steps:
      - uses: actions/checkout@v7
      - name: capture runner image
        id: runner-image
        if: matrix.os == 'ubuntu-latest'
        run: echo "image=${ImageOS:?GitHub-hosted runner must set ImageOS}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        if: matrix.os == 'ubuntu-latest'
        id: cache
        with:
          path: ~/.cache/mesa-apt
          key: mesa-vulkan-${{ steps.runner-image.outputs.image }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/test.yml') }}
      - name: install Mesa Vulkan driver
        if: matrix.os == 'ubuntu-latest'
        run: |
          apt_cache="$HOME/.cache/mesa-apt"
          mkdir -p "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          sudo chown _apt:root "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          apt_options=(-o Dir::Cache::archives="$apt_cache/archives" -o Dir::State::lists="$apt_cache/lists")
          if [[ "${{ steps.cache.outputs.cache-hit }}" == 'true' ]]; then
            sudo apt-get "${apt_options[@]}" install --no-download -y mesa-vulkan-drivers
          else
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y mesa-vulkan-drivers
          fi
          sudo chmod -R a+rX "$apt_cache"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: bun install --frozen-lockfile
      - name: Run Bun as node.exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $hostDir = Join-Path $env:RUNNER_TEMP 'bun-node'
          $realNodeDir = Split-Path (Get-Command node -ErrorAction Stop).Source -Parent
          Add-Content -Path $env:GITHUB_ENV -Value "SHALLOT_REAL_NODE_DIR=$realNodeDir"
          New-Item -ItemType Directory -Force -Path $hostDir | Out-Null
          Copy-Item (Get-Command bun).Source (Join-Path $hostDir 'node.exe')
          Add-Content -Path $env:GITHUB_PATH -Value $hostDir
          Write-Output "Bun node.exe host: $hostDir"
      - name: Identify WARP adapter
        if: matrix.os == 'windows-latest'
        run: node -e "import('webgpu').then(({ create, globals }) => { Object.assign(globalThis, globals); return create([]).requestAdapter(); }).then((adapter) => { if (!adapter) throw new Error('WARP adapter unavailable'); const info = adapter.info; const identity = [info.vendor, info.architecture, info.device, info.description].join(' '); if (!/warp|basic render/i.test(identity)) throw new Error('Expected WARP, got ' + identity); console.info('WARP adapter:', identity); })"
      - name: Node tier
        if: matrix.os != 'windows-latest'
        run: /usr/bin/time -p bun test --shard=${{ matrix.shard }} $(find ./src ./examples ./scripts ./diagnostics -name '*.node.ts' -print | sort)
      - name: Node tier on WARP
        if: matrix.os == 'windows-latest'
        run: |
          time -p node -e "const child = Bun.spawn([process.execPath, 'test', '--shard=${{ matrix.shard }}', ...process.argv.slice(1)], { argv0: 'bun.exe', env: { ...process.env, PATH: process.env.SHALLOT_REAL_NODE_DIR + ';' + process.env.PATH }, stdin: 'inherit', stdout: 'inherit', stderr: 'inherit' }); child.exited.then((code) => process.exit(code));" -- $(find ./src ./examples ./scripts ./diagnostics -name '*.node.ts' -print | sort)
      - name: compile time oracle
        if: matrix.shard == '1/2'
        run: bun test ./scripts/compile.oracle.ts

  checked-kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/5, 2/5, 3/5, 4/5, 5/5]
    steps:
      - uses: actions/checkout@v7
      - name: capture runner image
        id: runner-image
        run: echo "image=${ImageOS:?GitHub-hosted runner must set ImageOS}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: cache
        with:
          path: ~/.cache/mesa-apt
          key: mesa-vulkan-${{ steps.runner-image.outputs.image }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/test.yml') }}
      - name: install Mesa Vulkan driver
        run: |
          apt_cache="$HOME/.cache/mesa-apt"
          mkdir -p "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          sudo chown _apt:root "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          apt_options=(-o Dir::Cache::archives="$apt_cache/archives" -o Dir::State::lists="$apt_cache/lists")
          if [[ "${{ steps.cache.outputs.cache-hit }}" == 'true' ]]; then
            sudo apt-get "${apt_options[@]}" install --no-download -y mesa-vulkan-drivers
          else
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y mesa-vulkan-drivers
          fi
          sudo chmod -R a+rX "$apt_cache"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - name: install the shared kernel's nightly
        run: rustup toolchain install "$(grep -m1 -oE 'nightly-[0-9-]+' crates/physics/scripts/build-kernel.ts)" --component rust-src --target wasm32-unknown-unknown
      - name: build checked kernels
        run: bun crates/physics/scripts/build-kernel.ts --checked
      - name: cheap tier
        if: matrix.shard == '1/5'
        run: /usr/bin/time -p bun run test --path-ignore-patterns '**/*.gpu.test.ts' --path-ignore-patterns '**/*.test.node.ts'
      - name: Node tier
        run: /usr/bin/time -p bun test --shard=${{ matrix.shard }} $(find ./src ./examples ./scripts ./diagnostics -name '*.node.ts' -print | sort)

  browser:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: capture runner image
        id: runner-image
        if: matrix.os == 'ubuntu-latest'
        run: echo "image=${ImageOS:?GitHub-hosted runner must set ImageOS}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        if: matrix.os == 'ubuntu-latest'
        id: cache
        with:
          path: ~/.cache/mesa-apt
          key: mesa-vulkan-${{ steps.runner-image.outputs.image }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/test.yml') }}
      - name: install Mesa Vulkan driver
        if: matrix.os == 'ubuntu-latest'
        run: |
          apt_cache="$HOME/.cache/mesa-apt"
          mkdir -p "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          sudo chown _apt:root "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          apt_options=(-o Dir::Cache::archives="$apt_cache/archives" -o Dir::State::lists="$apt_cache/lists")
          if [[ "${{ steps.cache.outputs.cache-hit }}" == 'true' ]]; then
            sudo apt-get "${apt_options[@]}" install --no-download -y mesa-vulkan-drivers
          else
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y mesa-vulkan-drivers
          fi
          sudo chmod -R a+rX "$apt_cache"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: install Playwright Chromium
        run: bunx playwright install chromium
      - name: browser tier
        run: time -p bun run test:browser
