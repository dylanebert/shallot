name: test

on:
  workflow_dispatch:
    inputs:
      os:
        required: true
        type: choice
        options: [ubuntu-latest]
      tier:
        required: true
        type: choice
        options: [node]

jobs:
  replica-line-clipping-six-claims:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      CANDIDATE: 61dc4216b80f24b64e4d5bd102bf1114cebccf23
      BASELINE: 893d2296bfdd771b483ca0b720eb70d630a0f92e
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify exact source and native amd64 Docker
        run: |
          test "$(uname -m)" = x86_64
          docker info
          test "$(docker info --format '{{.Architecture}}')" = x86_64
          git diff --exit-code "$CANDIDATE" HEAD -- . ':!.github/workflows/test.yml'
          git rev-parse "$CANDIDATE^{tree}" "$BASELINE^{tree}"
      - name: Record wrapper image toolchain and adapter
        run: |
          sh scripts/lavapipe.sh "$CANDIDATE" sh -c '
            bun --version
            node --version
            dpkg-query -W mesa-vulkan-drivers libvulkan1
            node -e '\''import("webgpu").then(async ({create,globals}) => { Object.assign(globalThis, globals); const a=await create([]).requestAdapter(); if(!a)throw new Error("no adapter"); console.log(JSON.stringify({icd:process.env.VK_ICD_FILENAMES,info:{vendor:a.info.vendor,architecture:a.info.architecture,device:a.info.device,description:a.info.description,fallback:a.info.isFallbackAdapter},features:[...a.features].sort()})); (await a.requestDevice()).destroy(); })'\''
          ' 2>&1 | tee six-claims-adapter.log
          image=$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep '^shallot-lavapipe-amd64:')
          docker image inspect "$image" --format '{{.Id}} {{json .RepoTags}}' | tee -a six-claims-adapter.log
      - name: Observe exactly six missing claims and narrow baseline only new failures
        run: |
          python3 - <<'PY' 2>&1 | tee six-claims-results.log
          import json, os, re, subprocess
          cases = [
              ('examples/particles', "spawn, mid-stir and profiler captures use the game's composed first-person view"),
              *[('examples/gltf', category + ' models switch on the same canvas without horizontal scroll') for category in ['materials', 'textures', 'animation', 'lighting', 'compression']],
          ]
          print('EXPECTED_SELECTION ' + json.dumps(cases), flush=True)
          script = r'''
          set -eu
          subject=$1
          title=$2
          pattern=$3
          listed=$(mktemp)
          bunx playwright test -c "$subject" --grep "$pattern" --list --reporter=json > "$listed"
          node -e '
            const fs=require("node:fs"); const report=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const specs=[];
            const visit=s=>{specs.push(...(s.specs??[]));for(const child of s.suites??[])visit(child);};visit(report);
            const titles=specs.flatMap(s=>s.tests.map(()=>s.title));
            console.log("SELECTED_TESTS "+JSON.stringify({expected:process.argv[2],titles,count:titles.length}));
            if(titles.length!==1||titles[0]!==process.argv[2])process.exit(2);
          ' "$listed" "$title"
          rm -f "$listed"
          timeout=$(bun -e 'import { TIMEOUT } from "./src/project/testing.js"; console.log(TIMEOUT.browser)')
          report=$(mktemp)
          json_report=$(mktemp)
          status=0
          PLAYWRIGHT_JUNIT_OUTPUT_FILE="$report" PLAYWRIGHT_JSON_OUTPUT_FILE="$json_report" bunx playwright test -c "$subject" --grep "$pattern" --global-timeout="$timeout" --workers=1 --output="$subject/test-results" --reporter=list,junit,json || status=$?
          bun scripts/report-slow-tests.ts "$report" "" "$subject" "$json_report" || status=$?
          node -e '
            const fs=require("node:fs");const report=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            console.log("CLAIM_STATS "+JSON.stringify({subject:process.argv[2],title:process.argv[3],stats:report.stats}));
          ' "$json_report" "$subject" "$title"
          rm -f "$report" "$json_report"
          exit "$status"
          '''
          failed = 0
          for subject, title in cases:
              pattern = re.escape(title) + '$'
              print('CANDIDATE_CLAIM ' + json.dumps({'source': os.environ['CANDIDATE'], 'subject': subject, 'title': title}), flush=True)
              command = ['sh', 'scripts/lavapipe.sh', os.environ['CANDIDATE'], 'sh', '-c', script, 'sh', subject, title, pattern]
              result = subprocess.run(command)
              print('CANDIDATE_RESULT ' + json.dumps({'subject': subject, 'title': title, 'exit': result.returncode}), flush=True)
              if result.returncode:
                  failed += 1
                  print('NAMED_BASELINE_DOUBT ' + json.dumps({'source': os.environ['BASELINE'], 'subject': subject, 'title': title}), flush=True)
                  command[2] = os.environ['BASELINE']
                  baseline = subprocess.run(command)
                  print('BASELINE_RESULT ' + json.dumps({'subject': subject, 'title': title, 'exit': baseline.returncode}), flush=True)
          print('SIX_CLAIM_COVERAGE ' + json.dumps({'selected': len(cases), 'failed': failed}), flush=True)
          raise SystemExit(1 if failed else 0)
          PY
      - name: Retain text evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replica-line-clipping-six-claims-text
          path: six-claims-*.log
          if-no-files-found: error
