name: Windows adapter probe
on: workflow_dispatch
jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - run: bun examples/gltf/sync.ts
      - name: repeated image and gltf claims
        run: |
          status=0
          for subject in src/core/rendering/tests/images examples/gltf; do
            bunx playwright test -c "$subject" --retries=0 --workers=1 --repeat-each=8 || status=1
          done
          exit "$status"
      - name: full browser tier
        if: always()
        run: sh scripts/browser.sh --retries=0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results
          path: |
            examples/**/test-results/**
            src/**/test-results/**
            scripts/**/test-results/**
