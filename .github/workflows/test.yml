name: test

on:
  workflow_dispatch:
    inputs:
      os:
        required: true
        type: choice
        options: [ubuntu-latest]
      tier:
        required: true
        type: choice
        options: [node]

jobs:
  replica-line-clipping-lavapipe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CANDIDATE: 61dc4216b80f24b64e4d5bd102bf1114cebccf23
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verify candidate and native amd64 Docker
        run: |
          test "$(uname -m)" = x86_64
          docker info
          test "$(docker info --format '{{.Architecture}}')" = x86_64
          git diff --exit-code "$CANDIDATE" HEAD -- . ':!.github/workflows/test.yml'
          git rev-parse "$CANDIDATE^{tree}"
      - name: Identify software adapter inside exact wrapper
        run: |
          sh scripts/lavapipe.sh "$CANDIDATE" node -e 'import("webgpu").then(async ({create,globals}) => { Object.assign(globalThis, globals); const adapter = await create([]).requestAdapter(); if (!adapter) throw new Error("WebGPU adapter unavailable"); console.info("Lavapipe software premise:", process.env.VK_ICD_FILENAMES, "adapter:", adapter.info, "fallback:", adapter.isFallbackAdapter); (await adapter.requestDevice()).destroy(); })' 2>&1 | tee hosted-adapter.log
      - name: Exact final rendering set and render allocation oracle
        run: |
          sh scripts/lavapipe.sh "$CANDIDATE" sh -c 'bun test $(find ./src/core/rendering ./src/standard/rendering ./src/extras \( -name "*.test.ts" -o -name "*.node.ts" \) -print | sort) ./diagnostics/readback-allocation/render.oracle.ts' 2>&1 | tee hosted-rendering.log
      - name: All browser subjects through exact wrapper
        if: ${{ always() && !cancelled() }}
        run: |
          sh scripts/lavapipe.sh "$CANDIDATE" sh scripts/browser.sh 2>&1 | tee hosted-browser.log
      - name: Retain text evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replica-line-clipping-text-evidence
          path: hosted-*.log
          if-no-files-found: error
