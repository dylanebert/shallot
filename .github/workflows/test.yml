name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cheap:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: install dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: static gates
        run: bun run check
      - name: cheap tier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: /usr/bin/time -p bun run test

  gpu:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: GPU tier
        run: /usr/bin/time -p bun test ./src/transitional/mirror/index.gpu.ts

  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: audio tests
        run: /usr/bin/time -p cargo test -p shallot-audio
      - name: physics unit tests
        run: /usr/bin/time -p cargo test -p shallot-physics --lib --test stages
      - name: physics gold tests
        run: /usr/bin/time -p cargo test -p shallot-physics --test contact_gold --test contact_wide_gold --test convex_manifold_gold --test distance_gold --test finalize_gold --test integrate_gold --test joint_gold --test manifold_gold --test math_gold --test recycle_gold --test tree_gold

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - name: Node tier
        run: /usr/bin/time -p bun test ./examples/first-person/src/demo.node.ts ./scripts/packed-install.node.ts

  browser:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: install Playwright Chromium
        run: bunx playwright install chromium
      - name: browser tier
        run: /usr/bin/time -p bun run test:browser
