name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      os:
        description: Hosted operating system
        required: true
        type: choice
        options:
          - ubuntu-latest
          - macos-15
          - windows-latest
      tier:
        description: One CI job to run; cargo and checked-kernel require Ubuntu
        required: true
        type: choice
        options:
          - cheap
          - gpu
          - node
          - browser
          - cargo
          - checked-kernel
          - linux-native

concurrency:
  group: test-${{ github.event_name }}-${{ inputs.os || 'all' }}-${{ inputs.tier || 'all' }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cheap:
    timeout-minutes: 10
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tier == 'cheap' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && inputs.tier == 'cheap' && fromJSON(format('["{0}"]', inputs.os)) || fromJSON('["ubuntu-latest","macos-15","windows-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: install dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun check
      - name: Import gate
        run: bun test --todo ./scripts/check-imports.node.ts
      - name: Lint
        run: bun run lint
      - name: Rust format
        run: cargo fmt --check
      - name: Clippy (native physics)
        run: cargo clippy -p shallot-physics --all-targets -- -D warnings
      - name: Clippy (wasm physics)
        run: cargo clippy -p shallot-physics --lib --target wasm32-unknown-unknown -- -D warnings
      - name: cheap tier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: time -p bun run test --path-ignore-patterns '**/*.gpu.test.ts' --reporter=junit --reporter-outfile=cheap-junit.xml 2>&1 | tee cheap-test.log
      - name: report slow cheap tests
        if: always() && steps.install.outcome == 'success'
        env:
          RUNNER_OS: ${{ runner.os }}
        run: bun scripts/report-slow-tests.ts cheap-junit.xml cheap-test.log

  gpu:
    timeout-minutes: 10
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tier == 'gpu' }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && inputs.tier == 'gpu' && fromJSON(format('["{0}"]', inputs.os)) || fromJSON('["macos-15","ubuntu-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: capture runner image
        id: runner-image
        if: matrix.os == 'ubuntu-latest'
        run: echo "image=${ImageOS:?GitHub-hosted runner must set ImageOS}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        if: matrix.os == 'ubuntu-latest'
        id: cache
        with:
          path: ~/.cache/mesa-apt
          key: mesa-vulkan-${{ steps.runner-image.outputs.image }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/test.yml') }}
      - name: install Mesa Vulkan driver
        if: matrix.os == 'ubuntu-latest'
        run: |
          apt_cache="$HOME/.cache/mesa-apt"
          mkdir -p "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          sudo chown _apt:root "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          apt_options=(-o Dir::Cache::archives="$apt_cache/archives" -o Dir::State::lists="$apt_cache/lists")
          if [[ "${{ steps.cache.outputs.cache-hit }}" == 'true' ]]; then
            sudo apt-get "${apt_options[@]}" install --no-download -y mesa-vulkan-drivers
          else
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y mesa-vulkan-drivers
          fi
          sudo chmod -R a+rX "$apt_cache"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Run Bun as node.exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $hostDir = Join-Path $env:RUNNER_TEMP 'bun-node'
          New-Item -ItemType Directory -Force -Path $hostDir | Out-Null
          Copy-Item (Get-Command bun).Source (Join-Path $hostDir 'node.exe')
          Add-Content -Path $env:GITHUB_PATH -Value $hostDir
          Write-Output "Bun node.exe host: $hostDir"
      - name: Identify adapter
        run: |
          node -e "import('webgpu').then(({ create, globals }) => { Object.assign(globalThis, globals); return create([]).requestAdapter(); }).then(async (adapter) => { if (!adapter) throw new Error('WebGPU adapter unavailable'); const info = adapter.info; const identity = [info.vendor, info.architecture, info.device, info.description].join(' '); if (process.platform === 'win32' && !/warp|basic render/i.test(identity)) throw new Error('Expected WARP, got ' + identity); (await adapter.requestDevice()).destroy(); console.info('WebGPU adapter:', identity); })"
      - name: GPU tier
        if: matrix.os != 'windows-latest'
        run: /usr/bin/time -p bun scripts/gpu-compile.oracle.ts --reporter=junit --reporter-outfile=gpu-junit.xml 2>&1 | tee gpu-test.log
      - name: GPU tier on WARP
        if: matrix.os == 'windows-latest'
        run: time -p node scripts/gpu-compile.oracle.ts --reporter=junit --reporter-outfile=gpu-junit.xml 2>&1 | tee gpu-test.log
      - name: report slow GPU tests
        if: always()
        env:
          RUNNER_OS: ${{ runner.os }}
        run: bun scripts/report-slow-tests.ts gpu-junit.xml gpu-test.log

  cargo:
    timeout-minutes: 10
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.tier == 'cargo' && inputs.os == 'ubuntu-latest') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: audio tests
        run: /usr/bin/time -p cargo test -p shallot-audio
      - name: physics tests
        run: /usr/bin/time -p cargo test -p shallot-physics

  node:
    timeout-minutes: 20
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tier == 'node' }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.tier == 'node' && inputs.os == 'windows-latest' && '[{"os":"windows-latest","shard":"1/3"},{"os":"windows-latest","shard":"2/3"},{"os":"windows-latest","shard":"3/3"}]' || github.event_name == 'workflow_dispatch' && inputs.tier == 'node' && format('[{{"os":"{0}","shard":"1/2"}},{{"os":"{0}","shard":"2/2"}}]', inputs.os) || '[{"os":"macos-15","shard":"1/2"},{"os":"macos-15","shard":"2/2"},{"os":"ubuntu-latest","shard":"1/2"},{"os":"ubuntu-latest","shard":"2/2"},{"os":"windows-latest","shard":"1/3"},{"os":"windows-latest","shard":"2/3"},{"os":"windows-latest","shard":"3/3"}]') }}
    steps:
      - uses: actions/checkout@v7
      - name: capture runner image
        id: runner-image
        if: matrix.os == 'ubuntu-latest'
        run: echo "image=${ImageOS:?GitHub-hosted runner must set ImageOS}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        if: matrix.os == 'ubuntu-latest'
        id: cache
        with:
          path: ~/.cache/mesa-apt
          key: mesa-vulkan-${{ steps.runner-image.outputs.image }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/test.yml') }}
      - name: install Mesa Vulkan driver
        if: matrix.os == 'ubuntu-latest'
        run: |
          apt_cache="$HOME/.cache/mesa-apt"
          mkdir -p "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          sudo chown _apt:root "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          apt_options=(-o Dir::Cache::archives="$apt_cache/archives" -o Dir::State::lists="$apt_cache/lists")
          if [[ "${{ steps.cache.outputs.cache-hit }}" == 'true' ]]; then
            sudo apt-get "${apt_options[@]}" install --no-download -y mesa-vulkan-drivers
          else
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y mesa-vulkan-drivers
          fi
          sudo chmod -R a+rX "$apt_cache"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: bun install --frozen-lockfile
      - name: Run Bun as node.exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $hostDir = Join-Path $env:RUNNER_TEMP 'bun-node'
          $realNodeDir = Split-Path (Get-Command node -ErrorAction Stop).Source -Parent
          Add-Content -Path $env:GITHUB_ENV -Value "SHALLOT_REAL_NODE_DIR=$realNodeDir"
          New-Item -ItemType Directory -Force -Path $hostDir | Out-Null
          Copy-Item (Get-Command bun).Source (Join-Path $hostDir 'node.exe')
          Add-Content -Path $env:GITHUB_PATH -Value $hostDir
          Write-Output "Bun node.exe host: $hostDir"
      - name: Identify adapter
        run: |
          node -e "import('webgpu').then(({ create, globals }) => { Object.assign(globalThis, globals); return create([]).requestAdapter(); }).then(async (adapter) => { if (!adapter) throw new Error('WebGPU adapter unavailable'); const info = adapter.info; const identity = [info.vendor, info.architecture, info.device, info.description].join(' '); if (process.platform === 'win32' && !/warp|basic render/i.test(identity)) throw new Error('Expected WARP, got ' + identity); (await adapter.requestDevice()).destroy(); console.info('WebGPU adapter:', identity); })"
      - name: Node tier
        if: matrix.os != 'windows-latest'
        run: /usr/bin/time -p bun test --reporter=junit --reporter-outfile=node-junit.xml --shard=${{ matrix.shard }} $(find ./src ./examples ./scripts ./diagnostics -name '*.node.ts' -print | sort) 2>&1 | tee node-test.log
      - name: Node tier on WARP
        if: matrix.os == 'windows-latest'
        run: |
          time -p node -e "const child = Bun.spawn([process.execPath, 'test', '--reporter=junit', '--reporter-outfile=node-junit.xml', '--shard=${{ matrix.shard }}', ...process.argv.slice(1)], { argv0: 'bun.exe', env: { ...process.env, PATH: process.env.SHALLOT_REAL_NODE_DIR + ';' + process.env.PATH }, stdin: 'inherit', stdout: 'inherit', stderr: 'inherit' }); child.exited.then((code) => process.exit(code));" -- $(find ./src ./examples ./scripts ./diagnostics -name '*.node.ts' -print | sort) 2>&1 | tee node-test.log
      - name: report slow Node tests
        if: always()
        env:
          RUNNER_OS: ${{ runner.os }}
        run: bun scripts/report-slow-tests.ts node-junit.xml node-test.log
      - name: compile time oracle
        if: matrix.shard == '1/2'
        run: bun test ./scripts/compile.oracle.ts

  checked-kernel:
    timeout-minutes: 20
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.tier == 'checked-kernel' && inputs.os == 'ubuntu-latest') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v7
      - name: capture runner image
        id: runner-image
        run: echo "image=${ImageOS:?GitHub-hosted runner must set ImageOS}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: cache
        with:
          path: ~/.cache/mesa-apt
          key: mesa-vulkan-${{ steps.runner-image.outputs.image }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/test.yml') }}
      - name: install Mesa Vulkan driver
        run: |
          apt_cache="$HOME/.cache/mesa-apt"
          mkdir -p "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          sudo chown _apt:root "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          apt_options=(-o Dir::Cache::archives="$apt_cache/archives" -o Dir::State::lists="$apt_cache/lists")
          if [[ "${{ steps.cache.outputs.cache-hit }}" == 'true' ]]; then
            sudo apt-get "${apt_options[@]}" install --no-download -y mesa-vulkan-drivers
          else
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y mesa-vulkan-drivers
          fi
          sudo chmod -R a+rX "$apt_cache"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - name: install the shared kernel's nightly
        run: rustup toolchain install "$(grep -m1 -oE 'nightly-[0-9-]+' crates/physics/scripts/build-kernel.ts)" --component rust-src --target wasm32-unknown-unknown
      - name: build checked kernels
        run: bun crates/physics/scripts/build-kernel.ts --checked
      - name: cheap tier
        if: matrix.shard == '1/3'
        run: /usr/bin/time -p bun run test --path-ignore-patterns '**/*.gpu.test.ts' --path-ignore-patterns 'scripts/check-kernel.test.ts' --reporter=junit --reporter-outfile=checked-cheap-junit.xml 2>&1 | tee checked-cheap-test.log
      - name: report slow cheap tests
        if: always() && matrix.shard == '1/3'
        env:
          RUNNER_OS: ${{ runner.os }}
        run: bun scripts/report-slow-tests.ts checked-cheap-junit.xml checked-cheap-test.log
      - name: Identify adapter
        run: |
          node -e "import('webgpu').then(({ create, globals }) => { Object.assign(globalThis, globals); return create([]).requestAdapter(); }).then(async (adapter) => { if (!adapter) throw new Error('WebGPU adapter unavailable'); const info = adapter.info; const identity = [info.vendor, info.architecture, info.device, info.description].join(' '); if (process.platform === 'win32' && !/warp|basic render/i.test(identity)) throw new Error('Expected WARP, got ' + identity); (await adapter.requestDevice()).destroy(); console.info('WebGPU adapter:', identity); })"
      - name: Node tier
        run: /usr/bin/time -p bun test --reporter=junit --reporter-outfile=checked-node-junit.xml --shard=${{ matrix.shard }} $(find ./src ./examples ./scripts ./diagnostics -name '*.node.ts' ! -path './scripts/check-package.node.ts' -print | sort) 2>&1 | tee checked-node-test.log
      - name: report slow Node tests
        if: always()
        env:
          RUNNER_OS: ${{ runner.os }}
        run: bun scripts/report-slow-tests.ts checked-node-junit.xml checked-node-test.log

  linux-native:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.tier == 'linux-native' && inputs.os == 'ubuntu-latest') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60 # named budget for CEF download and native compilation; launch waits use CEILING.startup
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: install checkout dependencies
        run: bun install --frozen-lockfile
      - name: native toolchain identity
        id: native-toolchain
        run: echo "rustc=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/shallot/native-runtime-pair/consumer/cargo-target
          key: native-linux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/native/Cargo.lock') }}-${{ steps.native-toolchain.outputs.rustc }}
      - name: install Linux native smoke prerequisites
        run: |
          mkdir -p "$RUNNER_TEMP/native-runtime-pair/logs"
          bash scripts/native-linux-setup.sh 2>&1 | tee "$RUNNER_TEMP/native-runtime-pair/logs/setup.log"
      - name: exercise Linux smoke driver assertions
        run: bun test ./scripts/native-linux-smoke.oracle.ts
      - name: packed Linux native smoke
        run: |
          args=(--consumer "$HOME/.cache/shallot/native-runtime-pair/consumer" --logs "$RUNNER_TEMP/native-runtime-pair/logs")
          if [[ "${{ steps.native-cache.outputs.cache-hit }}" == 'true' ]]; then
            args+=(--plant-stale)
            echo 'Warm Cargo/CEF cache: stale release runtimes and consumer bundles will be planted.'
          else
            echo 'Cold Cargo/CEF cache: no cached runtime is assumed.'
          fi
          /usr/bin/time -p bun scripts/native-linux-smoke.ts "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/native-runtime-pair/logs/driver.log"
      - name: retain Linux native smoke logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-native-smoke-logs
          path: ${{ runner.temp }}/native-runtime-pair/logs
          if-no-files-found: warn

  browser:
    timeout-minutes: 10
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tier == 'browser' }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && inputs.tier == 'browser' && fromJSON(format('["{0}"]', inputs.os)) || fromJSON('["macos-15","ubuntu-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: capture runner image
        id: runner-image
        if: matrix.os == 'ubuntu-latest'
        run: echo "image=${ImageOS:?GitHub-hosted runner must set ImageOS}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        if: matrix.os == 'ubuntu-latest'
        id: cache
        with:
          path: ~/.cache/mesa-apt
          key: mesa-vulkan-${{ steps.runner-image.outputs.image }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/test.yml') }}
      - name: install Mesa Vulkan driver
        if: matrix.os == 'ubuntu-latest'
        run: |
          apt_cache="$HOME/.cache/mesa-apt"
          mkdir -p "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          sudo chown _apt:root "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          apt_options=(-o Dir::Cache::archives="$apt_cache/archives" -o Dir::State::lists="$apt_cache/lists")
          if [[ "${{ steps.cache.outputs.cache-hit }}" == 'true' ]]; then
            sudo apt-get "${apt_options[@]}" install --no-download -y mesa-vulkan-drivers
          else
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y mesa-vulkan-drivers
          fi
          sudo chmod -R a+rX "$apt_cache"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: install Playwright Chromium
        run: bunx playwright install chromium
      - name: browser tier
        id: browser
        run: time -p sh scripts/browser.sh
      - name: upload browser results
        if: ${{ !cancelled() && (failure() || steps.browser.outputs.flaky == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-results-${{ matrix.os }}
          path: |
            examples/**/test-results/**
            scripts/**/test-results/**
            src/**/test-results/**
