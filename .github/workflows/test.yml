name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cheap:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: install dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: static gates
        run: bun run check
      - name: cheap tier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: time -p bun run test --path-ignore-patterns '**/*.gpu.test.ts' --path-ignore-patterns '**/*.test.node.ts' --reporter=junit --reporter-outfile=cheap-junit.xml 2>&1 | tee cheap-test.log
      - name: report slow cheap tests
        if: always() && steps.install.outcome == 'success'
        env:
          RUNNER_OS: ${{ runner.os }}
        run: bun scripts/report-slow-tests.ts cheap-junit.xml cheap-test.log

  gpu:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: capture runner image
        id: runner-image
        if: matrix.os == 'ubuntu-latest'
        run: echo "image=${ImageOS:?GitHub-hosted runner must set ImageOS}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        if: matrix.os == 'ubuntu-latest'
        id: cache
        with:
          path: ~/.cache/mesa-apt
          key: mesa-vulkan-${{ steps.runner-image.outputs.image }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/test.yml') }}
      - name: install Mesa Vulkan driver
        if: matrix.os == 'ubuntu-latest'
        run: |
          apt_cache="$HOME/.cache/mesa-apt"
          mkdir -p "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          sudo chown _apt:root "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          apt_options=(-o Dir::Cache::archives="$apt_cache/archives" -o Dir::State::lists="$apt_cache/lists")
          if [[ "${{ steps.cache.outputs.cache-hit }}" == 'true' ]]; then
            sudo apt-get "${apt_options[@]}" install --no-download -y mesa-vulkan-drivers
          else
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y mesa-vulkan-drivers
          fi
          sudo chmod -R a+rX "$apt_cache"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: GPU tier
        run: /usr/bin/time -p bun scripts/gpu-compile.oracle.ts --reporter=junit --reporter-outfile=gpu-junit.xml 2>&1 | tee gpu-test.log
      - name: report slow GPU tests
        if: always()
        env:
          RUNNER_OS: ${{ runner.os }}
        run: bun scripts/report-slow-tests.ts gpu-junit.xml gpu-test.log

  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: audio tests
        run: /usr/bin/time -p cargo test -p shallot-audio
      - name: physics tests
        run: /usr/bin/time -p cargo test -p shallot-physics

  node:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v7
      - name: capture runner image
        id: runner-image
        if: matrix.os == 'ubuntu-latest'
        run: echo "image=${ImageOS:?GitHub-hosted runner must set ImageOS}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        if: matrix.os == 'ubuntu-latest'
        id: cache
        with:
          path: ~/.cache/mesa-apt
          key: mesa-vulkan-${{ steps.runner-image.outputs.image }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/test.yml') }}
      - name: install Mesa Vulkan driver
        if: matrix.os == 'ubuntu-latest'
        run: |
          apt_cache="$HOME/.cache/mesa-apt"
          mkdir -p "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          sudo chown _apt:root "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          apt_options=(-o Dir::Cache::archives="$apt_cache/archives" -o Dir::State::lists="$apt_cache/lists")
          if [[ "${{ steps.cache.outputs.cache-hit }}" == 'true' ]]; then
            sudo apt-get "${apt_options[@]}" install --no-download -y mesa-vulkan-drivers
          else
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y mesa-vulkan-drivers
          fi
          sudo chmod -R a+rX "$apt_cache"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: bun install --frozen-lockfile
      - name: Node tier
        run: /usr/bin/time -p bun test --reporter=junit --reporter-outfile=node-junit.xml --shard=${{ matrix.shard }} $(find ./src ./examples ./scripts ./diagnostics -name '*.node.ts' -print | sort) 2>&1 | tee node-test.log
      - name: report slow Node tests
        if: always()
        env:
          RUNNER_OS: ${{ runner.os }}
        run: bun scripts/report-slow-tests.ts node-junit.xml node-test.log
      - name: compile time oracle
        if: matrix.shard == '1/2'
        run: bun test ./scripts/compile.oracle.ts

  checked-kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        shard: [1/5, 2/5, 3/5, 4/5, 5/5]
    steps:
      - uses: actions/checkout@v7
      - name: capture runner image
        id: runner-image
        run: echo "image=${ImageOS:?GitHub-hosted runner must set ImageOS}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: cache
        with:
          path: ~/.cache/mesa-apt
          key: mesa-vulkan-${{ steps.runner-image.outputs.image }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/test.yml') }}
      - name: install Mesa Vulkan driver
        run: |
          apt_cache="$HOME/.cache/mesa-apt"
          mkdir -p "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          sudo chown _apt:root "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          apt_options=(-o Dir::Cache::archives="$apt_cache/archives" -o Dir::State::lists="$apt_cache/lists")
          if [[ "${{ steps.cache.outputs.cache-hit }}" == 'true' ]]; then
            sudo apt-get "${apt_options[@]}" install --no-download -y mesa-vulkan-drivers
          else
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y mesa-vulkan-drivers
          fi
          sudo chmod -R a+rX "$apt_cache"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - name: install the shared kernel's nightly
        run: rustup toolchain install "$(grep -m1 -oE 'nightly-[0-9-]+' crates/physics/scripts/build-kernel.ts)" --component rust-src --target wasm32-unknown-unknown
      - name: build checked kernels
        run: bun crates/physics/scripts/build-kernel.ts --checked
      - name: cheap tier
        if: matrix.shard == '1/5'
        run: /usr/bin/time -p bun run test --path-ignore-patterns '**/*.gpu.test.ts' --path-ignore-patterns '**/*.test.node.ts' --reporter=junit --reporter-outfile=checked-cheap-junit.xml 2>&1 | tee checked-cheap-test.log
      - name: report slow cheap tests
        if: always() && matrix.shard == '1/5'
        env:
          RUNNER_OS: ${{ runner.os }}
        run: bun scripts/report-slow-tests.ts checked-cheap-junit.xml checked-cheap-test.log
      - name: Node tier
        run: /usr/bin/time -p bun test --reporter=junit --reporter-outfile=checked-node-junit.xml --shard=${{ matrix.shard }} $(find ./src ./examples ./scripts ./diagnostics -name '*.node.ts' -print | sort) 2>&1 | tee checked-node-test.log
      - name: report slow Node tests
        if: always()
        env:
          RUNNER_OS: ${{ runner.os }}
        run: bun scripts/report-slow-tests.ts checked-node-junit.xml checked-node-test.log

  browser:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: capture runner image
        id: runner-image
        if: matrix.os == 'ubuntu-latest'
        run: echo "image=${ImageOS:?GitHub-hosted runner must set ImageOS}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        if: matrix.os == 'ubuntu-latest'
        id: cache
        with:
          path: ~/.cache/mesa-apt
          key: mesa-vulkan-${{ steps.runner-image.outputs.image }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/test.yml') }}
      - name: install Mesa Vulkan driver
        if: matrix.os == 'ubuntu-latest'
        run: |
          apt_cache="$HOME/.cache/mesa-apt"
          mkdir -p "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          sudo chown _apt:root "$apt_cache/archives/partial" "$apt_cache/lists/partial"
          apt_options=(-o Dir::Cache::archives="$apt_cache/archives" -o Dir::State::lists="$apt_cache/lists")
          if [[ "${{ steps.cache.outputs.cache-hit }}" == 'true' ]]; then
            sudo apt-get "${apt_options[@]}" install --no-download -y mesa-vulkan-drivers
          else
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y mesa-vulkan-drivers
          fi
          sudo chmod -R a+rX "$apt_cache"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: install Playwright Chromium
        run: bunx playwright install chromium
      - name: browser tier
        run: time -p bun run test:browser
