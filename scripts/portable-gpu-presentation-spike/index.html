<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            body { margin: 0; }
            canvas { display: block; }
        </style>
    </head>
    <body>
        <canvas id="canvas" width="1280" height="720"></canvas>
        <script>
            (async () => {
                const canvas = document.querySelector("#canvas");
                const state = (window.webgpuRepro = {
                    adapter: null,
                    format: null,
                    frames: 0,
                    deviceLoss: null,
                    errors: [],
                    error: null,
                    readbacks: {},
                    readbackErrors: [],
                });

                try {
                    const adapter = await navigator.gpu.requestAdapter();
                    if (!adapter) throw new Error("requestAdapter returned null");
                    state.adapter = {
                        vendor: adapter.info.vendor,
                        architecture: adapter.info.architecture,
                        device: adapter.info.device,
                        description: adapter.info.description,
                    };
                    const device = await adapter.requestDevice();
                    device.addEventListener("uncapturederror", (event) =>
                        state.errors.push(event.error.message),
                    );
                    void device.lost.then((info) => {
                        state.deviceLoss = { reason: info.reason, message: info.message };
                    });

                    const context = canvas.getContext("webgpu");
                    state.format = navigator.gpu.getPreferredCanvasFormat();
                    context.configure({
                        device,
                        format: state.format,
                        usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
                        alphaMode: "opaque",
                    });

                    const readback = (buffer, phase) => {
                        void buffer.mapAsync(GPUMapMode.READ).then(
                            () => {
                                const bytes = new Uint8Array(buffer.getMappedRange());
                                const offset = (360 * 1280 + 640) * 4;
                                state.readbacks[phase] = Array.from(bytes.subarray(offset, offset + 4));
                                buffer.unmap();
                                buffer.destroy();
                            },
                            (error) => {
                                state.readbackErrors.push(`${phase}: ${String(error)}`);
                                buffer.destroy();
                            },
                        );
                    };

                    function frame() {
                        const frame = state.frames + 1;
                        const phase = frame <= 120 ? "red" : "green";
                        const currentTexture = context.getCurrentTexture();
                        const encoder = device.createCommandEncoder();
                        const pass = encoder.beginRenderPass({
                            colorAttachments: [
                                {
                                    view: currentTexture.createView(),
                                    clearValue:
                                        phase === "red"
                                            ? { r: 1, g: 0, b: 0, a: 1 }
                                            : { r: 0, g: 1, b: 0, a: 1 },
                                    loadOp: "clear",
                                    storeOp: "store",
                                },
                            ],
                        });
                        pass.end();

                        let probe;
                        if (frame === 60 || frame === 180) {
                            probe = device.createBuffer({
                                size: 5120 * 720,
                                usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
                            });
                            encoder.copyTextureToBuffer(
                                { texture: currentTexture },
                                { buffer: probe, bytesPerRow: 5120, rowsPerImage: 720 },
                                { width: 1280, height: 720 },
                            );
                        }

                        device.queue.submit([encoder.finish()]);
                        state.frames = frame;
                        if (probe) readback(probe, phase);
                        requestAnimationFrame(frame);
                    }

                    requestAnimationFrame(frame);
                } catch (error) {
                    state.error = String(error);
                }
            })();
        </script>
    </body>
</html>
