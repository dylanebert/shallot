<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Late pipeline control</title></head>
<body>
<script type="module">
import { createApp } from "@dylanebert/shallot";
let module;
const app = await createApp({
    defaults: false,
    plugins: [{
        name: "LateOwner",
        gpu: {},
        initialize(world) {
            module = world.gpu.device.createShaderModule({
                code: "@compute @workgroup_size(1) fn main() {}",
            });
        },
    }],
});
const device = app.world.gpu.device;
device.createComputePipeline({
    label: "late-control",
    layout: device.createPipelineLayout({ bindGroupLayouts: [] }),
    compute: { module },
});
window.ready = true;
</script>
</body>
</html>
