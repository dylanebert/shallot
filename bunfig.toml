[test]
root = "packages/shallot"
# The per-file test-duration cap (`packages/shallot/tests/test-cap.ts`), appended after the TypeGPU
# transform (`tgsl.ts`, exactly one instance) and the WebGPU global setup (`setup.ts`, three lines).
# Sibling preload, never inlined into either.
#
# Reach: cwd-only. bun reads `bunfig.toml` from the process's working directory and does not walk
# ancestors (measured, bun 1.3.14), so this preload — and therefore the cap — is in force only for a
# `bun test` run from this directory. The `root` key scopes discovery to `packages/shallot`, but the
# cap fires on any `bun test` from here regardless of what paths are passed. Pinned in both
# directions by the configuration-reach arm pair in `packages/shallot/tests/test-cap.test.ts`.
preload = ["./packages/shallot/tests/tgsl.ts", "./packages/shallot/tests/setup.ts", "./packages/shallot/tests/test-cap.ts"]
