<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="A turning cube and ground under an orbit camera, built with Shallot." />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <title>minimal</title>
        <style>
            * { box-sizing: border-box; margin: 0; }
            html, body, canvas { width: 100%; height: 100%; }
            body { overflow: hidden; background: #10131b; }
            canvas { display: block; }
            [data-shallot-bootstrap] { position: fixed; inset: 0; display: grid; place-items: center; background: #141210; color: #f0e6d6; font: 14px system-ui, sans-serif; }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div data-shallot-bootstrap data-state="loading" role="status">Loading…</div>
        <script src="/startup.js"></script>
        <script type="module">
            import { runApp, shallotDark } from "@dylanebert/shallot";
            import { Welcome } from "./src/welcome";

            const bootstrap = document.querySelector("[data-shallot-bootstrap]");
            await runApp({ plugins: [Welcome], loading: shallotDark({ bootstrap }) });
        </script>
    </body>
</html>
