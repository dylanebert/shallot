<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><title>Save and load, stepped</title>
<style>body{margin:0;background:#191816}canvas{display:block;width:640px;height:360px}.capture canvas{width:1280px;height:720px}</style><link rel="stylesheet" href="../src/hud.css"/></head>
<body><canvas width="1280" height="720"></canvas>
<script type="module">
import { createApp, mountOverlay, StandardRenderer } from '@dylanebert/shallot';
import { pointerMove, pressButton, releaseButton, pressKey, releaseKey } from '@dylanebert/shallot/input';
import { attachCanvas, captureFrame } from '@dylanebert/shallot/rendering';
import { Scene } from '../src/scene';
import { count, Game } from '../src/game';
import { encode } from '../src/save';
import { hud } from '../src/hud';
// Software GPUs draw each frame in tenths of a second: claims run at 640x360, the person's captures at 1280x720.
const captures=new URLSearchParams(location.search).has('capture');
if(captures) document.body.classList.add('capture');
const app=await createApp({plugins:[Scene]});
const world=app.world, canvas=document.querySelector('canvas');
attachCanvas(world,world.resource(Game).camera,canvas);
hud(mountOverlay(canvas,world),world);
// Input, pile records and DOM are observed here; manual captures retain the scene draws.
if(!captures)world.remove(world.resource(Game).camera,StandardRenderer);
const advance=async(ticks=1)=>{while(ticks>0){const n=Math.min(ticks,4);world.step(n/60);ticks-=n;await world.frameFence;}return state();};
const state=()=>({count:count(world),save:encode(world)});
window.capture=async()=>{
 const pending=captureFrame(canvas);world.step(0);const image=await pending;
 const out=document.createElement('canvas');out.width=image.width;out.height=image.height;
 out.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(image.rgba),image.width,image.height),0,0);
 return out.toDataURL('image/png');
};
window.adapter=world.gpu.adapter;
const centre=()=>({x:canvas.clientWidth/2,y:canvas.clientHeight/2});
await advance(3);
window.saveAndLoad={state,advance,
 hover:()=>{pointerMove(world,{...centre(),hover:true});world.step(0);},
 click:()=>{pointerMove(world,{...centre(),hover:true});pressButton(world,'left');releaseButton(world,'left');world.step(0);},
 key:(code)=>{pressKey(world,code);world.step(0);releaseKey(world,code);world.step(0);}
};
</script></body></html>
