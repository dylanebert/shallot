<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>low-res, stepped</title>
    <style>* { box-sizing: border-box; margin: 0; } html, body, canvas { width: 100%; height: 100%; } body { overflow: hidden; background: #191816; } canvas { display: block; }</style>
</head>
<body>
<canvas></canvas>
<script type="module">
    import { createApp, mountOverlay } from "@dylanebert/shallot";
    import { captureFrame } from "@dylanebert/shallot/rendering";
    import { flushSync } from "svelte";
    import { hud } from "../src/hud";
    import { ScenePlugin } from "../src/scene";
    const canvas = document.querySelector("canvas");
    const app = await createApp({ plugins: [ScenePlugin] });
    hud(mountOverlay(canvas, app.world), app.world);
    flushSync();
    window.captureScene = async () => {
        flushSync();
        app.world.step(1 / 60);
        await app.world.frameFence;
        const pending = captureFrame(canvas);
        app.world.step(1 / 60);
        const image = await pending;
        return { width: image.width, height: image.height, rgba: Array.from(image.rgba) };
    };
    await window.captureScene();
    window.ready = true;
</script>
</body>
</html>
