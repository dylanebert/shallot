<!doctype html><html lang="en"><head><meta charset="UTF-8"/><title>Volumetric fog, stepped</title><link rel="icon" type="image/svg+xml" href="/icon.svg"/><style>body{margin:0;background:#191816}canvas{display:block}</style></head><body><canvas width="1280" height="720"></canvas>
<script type="module">
import { createApp, pressKey, releaseKey, GlobalTransform, VolumetricLight } from '@dylanebert/shallot';
import { attachTexture, captureTexture } from '@dylanebert/shallot/rendering';
import { NoFog } from '@dylanebert/shallot/extras';
import { Room, RoomPlugin } from '../src/room';
const app=await createApp({plugins:[RoomPlugin]});
const world=app.world, room=world.resource(Room);
attachTexture(world,room.camera,{width:1280,height:720});
world.step(1/60);world.step(1/60);
async function render(){world.step(0);return captureTexture(world,room.camera);}
window.hall={
 adapter:world.gpu.adapter,
 async image(){const image=await render();const c=document.createElement('canvas');c.width=image.width;c.height=image.height;c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(image.rgba),image.width,image.height),0,0);return c.toDataURL('image/png');},
 async evidence(regions){const on=(await render()).rgba;world.add(room.camera,NoFog);const off=(await render()).rgba;world.remove(room.camera,NoFog);return regions.map(([left,right,top,bottom])=>{let sum=0,count=0;for(let y=top;y<bottom;y++)for(let x=left;x<right;x++){const i=(y*1280+x)*4;sum+=(on[i]+on[i+1]+on[i+2]-off[i]-off[i+1]-off[i+2])/3;count++;}return sum/count;});},
 async contributions(regions){const on=(await render()).rgba;const result=[];for(const [j,lights] of [[room.sun],[room.downlight],room.pendants].entries()){const enabled=lights.filter(e=>world.has(e,VolumetricLight));for(const e of enabled)world.remove(e,VolumetricLight);const off=(await render()).rgba;for(const e of enabled)world.add(e,VolumetricLight);const [left,right,top,bottom]=regions[j];let sum=0,count=0;for(let y=top;y<bottom;y++)for(let x=left;x<right;x++){const i=(y*1280+x)*4;sum+=(on[i]+on[i+1]+on[i+2]-off[i]-off[i+1]-off[i+2])/3;count++;}result.push(sum/count);}return result;},
 walk(count=60){const p=world.storage(GlobalTransform).translation;const before=p.z.get(room.player);pressKey(world,'KeyW');for(let i=0;i<count;i++)world.step(1/60);releaseKey(world,'KeyW');return {before,after:p.z.get(room.player)};},
};
</script></body></html>
