<!doctype html><html lang="en"><head><link rel="stylesheet" href="../src/touch.css"><meta charset="UTF-8"/><title>Fog bench</title><style>body{margin:0;background:#141210}canvas{display:block}</style></head><body><canvas width="1280" height="720"></canvas>
<script type="module">
import { createApp, DiagnosticsStore, PointLight } from '@dylanebert/shallot';
import { attachTexture } from '@dylanebert/shallot/rendering';
import { PointShadows } from '@dylanebert/shallot/standard/rendering';
import { showProfiler, NoFog } from '@dylanebert/shallot/extras';
import { Room, RoomPlugin } from '../src/room';
const app=await createApp({plugins:[RoomPlugin]});
const world=app.world, room=world.resource(Room);
attachTexture(world,room.camera,{width:1280,height:720});
showProfiler(world);
const stats=world.resource(DiagnosticsStore);
async function frames(n) {
 const out={};
 for(let i=0;i<n;i++){
  world.step(0);await world.gpu.device.queue.onSubmittedWorkDone();await new Promise(r=>setTimeout(r,0));
  for(const d of stats.iter()){const p=d.path.path;if(!p.endsWith('/elapsed_gpu'))continue;const v=d.value();if(Number.isFinite(v))(out[p.slice(7,-12)]??=[]).push(v);}
 }
 const med=a=>{a=[...a].sort((x,y)=>x-y);return a[a.length>>1];};
 const r={};for(const[k,a]of Object.entries(out))r[k]=+med(a.slice(-60)).toFixed(3);
 return r;
}
window.bench={
 adapter:world.gpu.adapter,
 async run(variant={}) {
  if(variant.atlas)world.resource(PointShadows).atlas=variant.atlas;
  if(variant.noPointShadows)for(const e of room.pendants)world.storage(PointLight).shadowMapsEnabled.set(e,0);
  if(variant.noFog)world.add(room.camera,NoFog);
  await frames(30);
  const r=await frames(120);
  const n=variant.wall??600;await world.gpu.device.queue.onSubmittedWorkDone();const t0=performance.now();
  for(let i=0;i<n;i++){world.step(0);await world.gpu.device.queue.onSubmittedWorkDone();}
  r.wallMs=+((performance.now()-t0)/n).toFixed(3);
  return r;
 },
};
</script></body></html>
