<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>color-grading, stepped</title>
        <style>
            * { box-sizing: border-box; margin: 0; }
            html, body, canvas { width: 100%; height: 100%; }
            body { overflow: hidden; background: #191816; }
            canvas { display: block; }
        </style>
    </head>
    <body>
        <canvas width="1280" height="720"></canvas>
        <script type="module">
            import { Camera, ColorGrading, createApp, mountOverlay } from "@dylanebert/shallot";
            import { captureFrame } from "@dylanebert/shallot/rendering";
            import { flushSync } from "svelte";
            import { hud } from "../src/hud";
            import { Scene, ScenePlugin } from "../src/scene";

            const canvas = document.querySelector("canvas");
            const app = await createApp({ plugins: [ScenePlugin] });
            // Controls checks read focus and orbit yaw, not pixels; without a Camera a step draws nothing,
            // and input stays bound to the canvas.
            if (new URL(location.href).searchParams.has("controls"))
                for (const eid of [...app.world.query([Camera])]) app.world.remove(eid, Camera);
            const { Orbit } = await import("@dylanebert/shallot/extras");
            window.controlsKey = () => {
                app.world.step(1 / 60);
                return app.world.storage(Orbit).yaw.get(app.world.resource(Scene).camera);
            };
            const { settings } = await import("../src/settings");
            window.gradingField = (index) => {
                const { field, axis } = settings[index];
                const column = app.world.storage(ColorGrading)[field];
                const camera = app.world.resource(Scene).camera;
                return axis ? column[axis].get(camera) : column.get(camera);
            };
            hud(mountOverlay(canvas, app.world), app.world);
            flushSync();
            app.world.step(0);
            app.world.step(0);
            window.setGrading = (enabled) => {
                const camera = app.world.resource(Scene).camera;
                if (enabled) app.world.add(camera, ColorGrading);
                else app.world.remove(camera, ColorGrading);
            };
            window.captureScene = async () => {
                flushSync();
                const pending = captureFrame(canvas);
                app.world.step(0);
                const image = await pending;
                return Array.from(image.rgba);
            };
        </script>
    </body>
</html>
