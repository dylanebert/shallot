<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><title>Lit interior, stepped</title>
<style>body{margin:0;background:#191816}canvas{display:block}</style></head>
<body><canvas width="1280" height="720"></canvas>
<script type="module">
import { Camera, createApp, Transform, MeshInstance, setTransform } from '@dylanebert/shallot';
import { attachTexture, captureTexture, captureFrame, worldToViewport } from '@dylanebert/shallot/rendering';
import { DirectionalLightShadowMap, PointShadows } from '@dylanebert/shallot/standard/rendering';
import { Room, RoomPlugin } from '../src/room';
import { LocalPlayer, Player } from '../src/player';
const requests=[];
const requestDevice=GPUAdapter.prototype.requestDevice;
GPUAdapter.prototype.requestDevice=function(descriptor){requests.push(descriptor??{});return requestDevice.call(this,descriptor);};
const app=await createApp({plugins:[RoomPlugin]});
const w=app.world, room=w.resource(Room);
const canvas=document.querySelector('canvas');
const captures=new URLSearchParams(location.search).has('captures');
if(!captures){canvas.width=320;canvas.height=180;attachTexture(w,room.camera,{width:320,height:180});w.storage(Camera).antialias.set(room.camera,0);w.resource(PointShadows).atlas=1024;w.resource(DirectionalLightShadowMap).size=512;}
w.storage(Player).gravity.set(room.player,0);
w.storage(Player).friction.set(room.player,1000);
window.view=(x=2.5,y=1,z=11,yaw=0.25,pitch=-0.05)=>{
 setTransform(w,room.player,[x,y,z],[0,0,0,1]);
 w.storage(Transform).translation.set(room.player,x,y,z);
 w.storage(LocalPlayer).viewYaw.set(room.player,yaw);
 w.storage(LocalPlayer).viewPitch.set(room.player,pitch);
 w.storage(LocalPlayer).initialized.set(room.player,1);
 w.tick();w.tick();w.step(0);
};
async function render(draw=true){if(!captures){if(draw)w.step(0);return captureTexture(w,room.camera);}const pending=captureFrame(canvas);w.step(0);return pending;}
window.capture=async()=>{const image=await render();const c=document.createElement('canvas');c.width=image.width;c.height=image.height;c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(image.rgba),image.width,image.height),0,0);return c.toDataURL('image/png');};
function pixel(x,y,z){const [px,py]=worldToViewport(w,room.camera,[x,y,z]);return [Math.round(px),Math.round(py)];}
function patch(image,point,radius=1){const [cx,cy]=pixel(...point);let sum=0,n=0;for(let y=cy-radius;y<=cy+radius;y++)for(let x=cx-radius;x<=cx+radius;x++){const i=(y*image.width+x)*4;sum+=0.2126*image.rgba[i]+0.7152*image.rgba[i+1]+0.0722*image.rgba[i+2];n++;}return sum/n;}
window.regions=async()=>{const image=await render(false);return {sunlitFloor:patch(image,[0,0,-7]),darkFloor:patch(image,[0,0,-1]),pools:[patch(image,[-2,0,4]),patch(image,[-2,0,8])]};};
function patchRgb(image,point){const [cx,cy]=pixel(...point),rgb=[0,0,0];for(let y=cy-1;y<=cy+1;y++)for(let x=cx-1;x<=cx+1;x++)for(let c=0;c<3;c++)rgb[c]+=image.rgba[(y*image.width+x)*4+c]/9;return rgb;}
function oklabL(rgb){const [r,g,b]=rgb.map(v=>{v/=255;return v<=0.04045?v/12.92:((v+0.055)/1.055)**2.4;});return 0.2104542553*Math.cbrt(0.4122214708*r+0.5363325363*g+0.0514459929*b)+0.793617785*Math.cbrt(0.2119034982*r+0.6806995451*g+0.1073969566*b)-0.0040720468*Math.cbrt(0.0883024619*r+0.2817188376*g+0.6299787005*b);}
window.appearance=async()=>{const image=await render(false),wallRgb=patchRgb(image,[-4.3,2,0]);return {window:patch(image,[0,3,-12]),sunlitFloor:patch(image,[0,0,-7]),wallRgb,wallL:oklabL(wallRgb),clearL:oklabL([25,24,22]),ceilingL:oklabL(patchRgb(image,[0,5,-1])),floorL:oklabL(patchRgb(image,[0,0,-1]))};};
let baseline;
window.shadow=async(kind)=>{
 const eids=kind==='block'?[room.object]:room.bulbs;
 const before=baseline??=await render(false);
 for(const eid of eids)w.remove(eid,MeshInstance);
 const after=await render();
 for(const eid of eids)w.add(eid,MeshInstance);
 let darkened=0,maxDelta=0;const sampled=new Set();
 for(let x=-2.5;x<=0.5;x+=0.025)for(let z=4.5;z<=5.5;z+=0.025){
  const [px,py]=pixel(x,0,z),index=py*before.width+px;
  if(sampled.has(index))continue;sampled.add(index);
  const d=patch(after,[x,0,z],0)-patch(before,[x,0,z],0);
  if(d>5)darkened++;maxDelta=Math.max(maxDelta,d);
 }
 return {darkened,darkenedFraction:darkened/(before.width*before.height),maxDelta};
};
window.device={requests,adapter:w.gpuIfAvailable.adapter,limits:{maxStorageBuffersPerShaderStage:w.gpuIfAvailable.device.limits.maxStorageBuffersPerShaderStage}};
window.view();
window.ready=true;
</script></body></html>
