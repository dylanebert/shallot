<!doctype html><html lang="en"><head><meta charset="UTF-8"/><title>Particles, stepped</title><link rel="icon" type="image/svg+xml" href="/icon.svg"/><style>body{margin:0;background:#191816}canvas{display:block}</style></head><body><canvas width="1280" height="720"></canvas>
<script type="module">
import { createApp, Camera, GlobalTransform, pressKey, releaseKey, setInputEnabled } from '@dylanebert/shallot';
import { attachTexture, detachView, captureTexture, captureFrame } from '@dylanebert/shallot/rendering';
import { DiagnosticsStore } from '@dylanebert/shallot';
import { NoFog, showProfiler } from '@dylanebert/shallot/extras';
import { Motes, MotesPlugin } from '../src/motes';
import { Room } from '../src/room';
const requests=[];
const request=GPUAdapter.prototype.requestDevice;
GPUAdapter.prototype.requestDevice=function(descriptor) { requests.push({requiredLimits:descriptor?.requiredLimits, requiredFeatures:descriptor?.requiredFeatures}); return request.call(this,descriptor); };
const app=await createApp({plugins:[MotesPlugin]});
const world=app.world, room=world.resource(Room), motes=world.resource(Motes);
const canvas=document.querySelector('canvas');
const captures=new URLSearchParams(location.search).has('captures');
if (!captures) {
 canvas.width=320;canvas.height=180;
 attachTexture(world,room.camera,{width:320,height:180});
 world.storage(Camera).antialias.set(room.camera,0);
}
world.step(1/60);world.step(1/60);
async function render() {
 if (!captures) {world.step(0);return captureTexture(world,room.camera);}
 const pending=captureFrame(canvas);world.step(0);return pending;
}
window.particles={
 adapter:world.gpu.adapter,
 requests,
 async evidence() {
  const on=(await render()).rgba;
  motes.visible=false;
  const off=(await render()).rgba;
  world.add(room.camera,NoFog);
  const clear=(await render()).rgba;
  world.remove(room.camera,NoFog);
  motes.visible=true;
  let increase=0,changed=0,count=0;
  // The central window and the shaft below it, not the room's unlit corners.
  for(let y=45;y<150;y++) for(let x=125;x<195;x++) {
   const i=(y*320+x)*4;
   const delta=(on[i]+on[i+1]+on[i+2]-off[i]-off[i+1]-off[i+2])/3;
   increase+=delta;changed+=Number(delta>2);count++;
  }
  const floorMean=(left,right)=>{
   let sum=0,count=0;
   for(let y=173;y<178;y++) for(let x=left;x<right;x++) {
    const i=(y*320+x)*4;
    sum+=(off[i]+off[i+1]+off[i+2])/3;count++;
   }
   return sum/count;
  };
  const linear=value=>{const s=value/255;return s<=0.04045?s/12.92:((s+0.055)/1.055)**2.4;};
  const luminance=(r,g,b)=>0.2126*linear(r)+0.7152*linear(g)+0.0722*linear(b);
  const regionLuminance=(left,right,top,bottom,image=off)=>{
   let sum=0,count=0;
   for(let y=top;y<bottom;y++) for(let x=left;x<right;x++) {
    const i=(y*320+x)*4;
    sum+=luminance(image[i],image[i+1],image[i+2]);count++;
   }
   return sum/count;
  };
  return {
   increase:increase/count,changed,floorBeam:floorMean(140,180),floorShade:floorMean(80,100),
   wallLuminance:regionLuminance(100,120,75,95),
   floorLuminance:regionLuminance(140,180,173,178),
   clearLuminance:luminance(0x19,0x18,0x16),
   hazeBeam:regionLuminance(150,170,115,140)-regionLuminance(150,170,115,140,clear),
   hazeShade:regionLuminance(70,85,115,140)-regionLuminance(70,85,115,140,clear),
  };
 },
 walk(count=45) {
  // Only the final view is observed; keep every simulated and GPU-stirred frame, not its pixels.
  if (!captures) {detachView(world,room.camera);attachTexture(world,room.camera,{width:16,height:9});}
  const pose=world.storage(GlobalTransform).translation;
  const before=pose.z.get(room.player);
  setInputEnabled(world,true);pressKey(world,'KeyW');
  for(let i=0;i<count;i++)world.step(1/60);
  releaseKey(world,'KeyW');
  if (!captures) {detachView(world,room.camera);attachTexture(world,room.camera,{width:320,height:180});}
  return {before,after:pose.z.get(room.player)};
 },
 async profile() {
  world.step(0);
  const stats=world.resource(DiagnosticsStore);
  const gpuTiming=world.gpu.device.features.has('timestamp-query')?'available':'requires timestamp-query';
  if(gpuTiming==='available') while(!stats.get('render/particles:advance/elapsed_gpu')) {
   world.step(0);await world.gpu.sync();await new Promise(resolve=>setTimeout(resolve,0));
  }
  return {gpuTiming,passes:[...stats.iter()].filter(d=>d.path.path.endsWith('/elapsed_gpu')).map(d=>d.path.path.slice(7,-12))};
 },
 profiler() {showProfiler(world);world.step(0);},
 async capture() {
  const image=await render();const c=document.createElement('canvas');c.width=image.width;c.height=image.height;
  c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(image.rgba),image.width,image.height),0,0);
  return c.toDataURL('image/png');
 },
};
</script></body></html>
