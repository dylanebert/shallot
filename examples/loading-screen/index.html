<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="A game's own title card, held until its intro and minimum dwell end." />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <title>loading-screen</title>
        <style>
            * { box-sizing: border-box; margin: 0; }
            html, body, canvas { width: 100%; height: 100%; }
            body { overflow: hidden; background: #191816; }
            canvas { display: block; }
            .title-card { zoom: max(1, calc(100vmin / 720px)); position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; background: #191816; color: #eee9df; font: 400 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
            .lockup { width: min(80%, 420px); text-align: center; }
            h1 { margin-bottom: 24px; font-size: 24px; font-weight: 400; }
            .track { width: 100%; height: 3px; overflow: hidden; background: #282622; }
            .progress { width: 0; height: 100%; background: #ddaa3f; }
            .notice { margin-top: 16px; font-size: 14px; }
            .error { margin-top: 24px; padding: 16px; background: #282622; border: 1px solid #797369; white-space: pre-wrap; text-align: left; line-height: 1.6; }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div class="title-card" data-shallot-bootstrap data-state="loading" role="status">
            <div class="lockup">
                <h1></h1>
                <div class="track"><div class="progress"></div></div>
                <p class="notice">Loading…</p>
                <div class="error" hidden></div>
            </div>
        </div>
        <script>document.querySelector(".title-card h1").textContent = document.title;</script>
        <script src="/startup.js"></script>
        <script type="module">
            import { runApp } from "@dylanebert/shallot";
            import { Welcome } from "./src/welcome";
            import { titleCard } from "./src/title-card";

            const bootstrap = document.querySelector("[data-shallot-bootstrap]");
            await runApp({ plugins: [Welcome], loading: titleCard(bootstrap) });
        </script>
    </body>
</html>
