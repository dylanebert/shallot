<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="A game's own title card, held until its intro and minimum dwell end." />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <title>loading-screen</title>
        <style>
            * { box-sizing: border-box; margin: 0; }
            html, body, canvas { width: 100%; height: 100%; }
            body { overflow: hidden; background: #1c1917; }
            canvas { display: block; }
            .title-card { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; background: #1c1917; color: #efe3cf; font: 14px system-ui, sans-serif; }
            .lockup { width: min(80vw, 420px); text-align: center; }
            .mark { display: inline-block; color: #cf8d60; font-size: 64px; line-height: 1; margin-bottom: 24px; transform: rotate(-90deg) scale(0.6); }
            @media (prefers-reduced-motion: reduce) { .mark { transform: none; } }
            h1 { font-size: clamp(36px, 7vw, 56px); letter-spacing: -2px; font-weight: 500; }
            .subtitle { margin: 12px 0 32px; letter-spacing: 4px; font-size: 11px; }
            .track { width: 100%; height: 3px; overflow: hidden; background: #373635; }
            .progress { width: 0; height: 100%; background: #cf8d60; }
            .notice { margin-top: 16px; font-size: 12px; }
            .error { margin-top: 24px; padding: 16px; background: #373635; border: 1px solid #cf8d60; white-space: pre-wrap; text-align: left; line-height: 1.6; }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div class="title-card" data-shallot-bootstrap data-state="loading" role="status">
            <div class="lockup">
                <div class="mark" aria-hidden="true">◇</div>
                <h1>Ember Atlas</h1>
                <p class="subtitle">CHART THE QUIET FIRE</p>
                <div class="track"><div class="progress"></div></div>
                <p class="notice">Preparing your expedition…</p>
                <div class="error" hidden></div>
            </div>
        </div>
        <script src="/startup.js"></script>
        <script type="module">
            import { runApp } from "@dylanebert/shallot";
            import { Welcome } from "./src/welcome";
            import { titleCard } from "./src/title-card";

            const bootstrap = document.querySelector("[data-shallot-bootstrap]");
            await runApp({ plugins: [Welcome], loading: titleCard(bootstrap) });
        </script>
    </body>
</html>
