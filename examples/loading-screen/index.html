<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="A game's own title card, held until its intro and minimum dwell end." />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <title>loading-screen</title>
        <style>
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/plex/IBMPlexSans-Regular-Latin1.woff2') format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/mono/JetBrainsMono-Regular.woff2') format('woff2'); }
            * { box-sizing: border-box; margin: 0; }
            html, body, canvas { width: 100%; height: 100%; }
            body { overflow: hidden; background: #141210; }
            canvas { display: block; }
            .title-card { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; background: #141210; color: #f0e6d6; font: 400 13px/20px 'IBM Plex Sans', system-ui, sans-serif; }
            .lockup { width: min(80%, 420px); text-align: center; }
            h1 { margin-bottom: 8px; font: 400 24px/20px 'JetBrains Mono', ui-monospace, monospace; }
            .track { width: 100%; height: 4px; overflow: hidden; background: #1c1917; }
            .progress { width: 0; height: 100%; background: #d49560; }
            .notice { margin-top: 8px; }
            .error { margin-top: 8px; padding: 8px; background: #1c1917; border: 1px solid #2a2420; white-space: pre-wrap; text-align: left; }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div class="title-card" data-shallot-bootstrap data-state="loading" role="status">
            <div class="lockup">
                <h1></h1>
                <div class="track"><div class="progress"></div></div>
                <p class="notice">Loading…</p>
                <div class="error" hidden></div>
            </div>
        </div>
        <script>document.querySelector(".title-card h1").textContent = document.title;</script>
        <script src="/startup.js"></script>
        <script type="module">
            import { runApp } from "@dylanebert/shallot";
            import { Welcome } from "./src/welcome";
            import { titleCard } from "./src/title-card";

            const bootstrap = document.querySelector("[data-shallot-bootstrap]");
            await runApp({ plugins: [Welcome], loading: titleCard(bootstrap) });
        </script>
    </body>
</html>
