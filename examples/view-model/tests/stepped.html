<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>View model stepped</title><style>body{margin:0;background:#191816}canvas{display:block}</style></head><body><canvas width="640" height="360"></canvas><script type="module">
import { createApp, Camera, MeshInstance, DirectionalLight, pressKey, releaseKey, probeBuffer } from '@dylanebert/shallot';
import { attachTexture, captureTexture, Views, RenderLayers } from '@dylanebert/shallot/rendering';
import { Draws } from '@dylanebert/shallot/standard/rendering';
import { Scene, ScenePlugin, pose } from '../src/scene';
const app=await createApp({plugins:[ScenePlugin]});
const w=app.world,s=w.resource(Scene),canvas=document.querySelector('canvas');
const target=attachTexture(w,s.camera,{width:640,height:360});attachTexture(w,s.modelCamera,target);
for(const eid of [s.camera,s.modelCamera])w.storage(Camera).antialias.set(eid,0);
async function image(){ w.step(0); return (await captureTexture(w,s.camera)).rgba; }
function key(){pressKey(w,'KeyE');w.step(1/60);releaseKey(w,'KeyE');w.step(1/60);}
function mask(value){for(const eid of s.parts)w.storage(RenderLayers).mask.set(eid,value);}
function changed(a,b){let n=0;for(let i=0;i<a.length;i+=4)if(Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2])>15)n++;return n;}
window.evidence=async(name)=>{
 if(!s.held)key(); s.z=2;s.yaw=0;s.pitch=0;pose(w);mask(2);
 w.storage(Camera).fov.set(s.camera,90);w.storage(DirectionalLight).illuminance.set(s.light,6000);
 if(name==='contact'){
  s.z=-0.65;pose(w);const on=await image();mask(0);const off=await image();mask(2);return changed(on,off);
 }
 if(name==='depth'){
  w.add(s.camera,RenderLayers,{mask:0});const on=await image();
  w.storage(RenderLayers).mask.set(s.parts[0],0);const off=await image();mask(2);w.remove(s.camera,RenderLayers);
  // The grip meets the housing behind its front face.
  let n=0;for(let y=260;y<275;y++)for(let x=395;x<410;x++){let i=(y*640+x)*4;n+=Math.abs(on[i]-off[i])+Math.abs(on[i+1]-off[i+1])+Math.abs(on[i+2]-off[i+2]);}
  return {overlap:n, exposed:changed(on,off)};
 }
 if(name==='count'){
  const count=async()=>{await image();let total=0;for(const draw of w.resource(Draws).values()){
   const bytes=(await probeBuffer(w,w.gpu.root.unwrap(draw.args.indirect))).bytes;
   const words=new Uint32Array(bytes);
   for(const eid of [s.camera,s.modelCamera])total+=words[((draw.args.offset??0)+w.resource(Views).get(eid).slot*(draw.args.viewStride??0))/4+1];
  }return total;};
  const on=await count();mask(0);const off=await count();mask(2);return on-off;
 }
 if(name==='dropped'){
  s.z=-0.65;pose(w);key();s.z=2;pose(w);const on=await image();mask(0);const off=await image();mask(1);return changed(on,off);
 }
 w.add(s.camera,RenderLayers,{mask:0});const before=await image();
 if(name==='fov')w.storage(Camera).fov.set(s.camera,45);
 if(name==='light')w.storage(DirectionalLight).illuminance.set(s.light,0);
 const after=await image();w.remove(s.camera,RenderLayers);return changed(before,after);
};
window.frame=async(name)=>{
 if(!s.held)key();s.z=name==='held'?2:-0.65;s.yaw=0;s.pitch=0;pose(w);mask(2);
 w.storage(Camera).fov.set(s.camera,90);w.storage(DirectionalLight).illuminance.set(s.light,6000);
 if(name==='dropped'){key();s.z=2;pose(w);}
 const rgba=await image();canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(rgba),640,360),0,0);
};
window.adapter=w.gpu.adapter;window.ready=true;
</script></body></html>
