<!doctype html><html lang="en"><head><link rel="stylesheet" href="../src/touch.css"><meta charset="UTF-8"><title>View model stepped</title><style>body{margin:0;background:#191816}canvas{display:block}</style></head><body><canvas width="640" height="360"></canvas><script type="module">
import { createApp, Camera, DirectionalLight, probeBuffer, pointerMove, pointerLockChanged, Materials, MeshMaterial, StandardMaterial, setTransform } from '@dylanebert/shallot';
import { attachTexture, captureTexture, Views, RenderLayers } from '@dylanebert/shallot/rendering';
import { Draws } from '@dylanebert/shallot/standard/rendering';
import { PhysicsWorldDefinition } from '@dylanebert/shallot/standard/physics';
import { Scene, ScenePlugin } from '../src/scene';
import { LocalPlayer, Player } from '../src/player';
const app=await createApp({plugins:[ScenePlugin, {name:'CheckPhysics',initialize(world){world.resource(PhysicsWorldDefinition).workerCount=1;}}]});
const w=app.world,s=w.resource(Scene),canvas=document.querySelector('canvas');
w.storage(Player).gravity.set(s.player,0);
const target=attachTexture(w,s.camera,{width:640,height:360});attachTexture(w,s.modelCamera,target);
for(const eid of [s.camera,s.modelCamera])w.storage(Camera).antialias.set(eid,0);
async function image(){ w.step(0); return (await captureTexture(w,s.camera)).rgba; }
function position(z){
 setTransform(w,s.player,[0,0.9,z],[0,0,0,1]);
 w.storage(LocalPlayer).viewYaw.set(s.player,0);w.storage(LocalPlayer).viewPitch.set(s.player,0);
 w.step(1/60);w.step(1/60);
}
// Hides the given parts; the returned function restores each part's own layers.
function hideParts(parts=s.parts){
 const layers=parts.map(eid=>w.storage(RenderLayers).mask.get(eid));
 for(const eid of parts)w.storage(RenderLayers).mask.set(eid,0);
 return()=>parts.forEach((eid,i)=>w.storage(RenderLayers).mask.set(eid,layers[i]));
}
// A check of the evidence calls' own restoring starts with the first part hidden.
if(new URL(location.href).searchParams.has('hidden'))w.storage(RenderLayers).mask.set(s.parts[0],0);
// Shows only the view model; the returned function restores the world camera's own layers.
function hideWorld(){
 const had=w.has(s.camera,RenderLayers),layers=had?w.storage(RenderLayers).mask.get(s.camera):0;
 if(had)w.storage(RenderLayers).mask.set(s.camera,0);else w.add(s.camera,RenderLayers,{mask:0});
 return()=>{if(had)w.storage(RenderLayers).mask.set(s.camera,layers);else w.remove(s.camera,RenderLayers);};
}
function changed(a,b){let n=0;for(let i=0;i<a.length;i+=4)if(Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2])>15)n++;return n;}
window.evidence=async(name)=>{
 position(2);
 if(name==='contact'){
  position(-0.6);const on=await image();const showParts=hideParts();const off=await image();showParts();return changed(on,off);
 }
 if(name==='depth'){
  const showWorld=hideWorld();const on=await image();
  const showPart=hideParts([s.parts[0]]);const off=await image();showPart();showWorld();
  // The grip meets the housing behind its front face.
  let n=0;for(let y=260;y<275;y++)for(let x=395;x<410;x++){let i=(y*640+x)*4;n+=Math.abs(on[i]-off[i])+Math.abs(on[i+1]-off[i+1])+Math.abs(on[i+2]-off[i+2]);}
  return {overlap:n, exposed:changed(on,off)};
 }
 if(name==='count'){
  const count=async()=>{await image();let total=0;for(const draw of w.resource(Draws).values()){
   const bytes=(await probeBuffer(w,w.gpu.root.unwrap(draw.args.indirect))).bytes;
   const words=new Uint32Array(bytes);
   for(const eid of [s.camera,s.modelCamera])total+=words[((draw.args.offset??0)+w.resource(Views).get(eid).slot*(draw.args.viewStride??0))/4+1];
  }return total;};
  const on=await count();const showParts=hideParts();const off=await count();showParts();return on-off;
 }
 const showWorld=hideWorld();const before=await image();
 const fov=w.storage(Camera).fov.get(s.camera),illuminance=w.storage(DirectionalLight).illuminance.get(s.light);
 if(name==='fov')w.storage(Camera).fov.set(s.camera,45);
 if(name==='light')w.storage(DirectionalLight).illuminance.set(s.light,0);
 const after=await image();showWorld();
 w.storage(Camera).fov.set(s.camera,fov);w.storage(DirectionalLight).illuminance.set(s.light,illuminance);
 return changed(before,after);
};
window.frame=async(name)=>{
 position(name==='held'?2:-0.6);
 const rgba=await image();canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(rgba),640,360),0,0);
};
window.jitter=async()=>{
 position(2);w.add(s.camera,RenderLayers,{mask:0});
 // Unlit white makes silhouette, rather than changing world-space lighting, the placement observable.
 const white=w.resource(Materials).add(StandardMaterial({baseColor:[1,1,1,1],unlit:true}));
 for(const eid of s.parts){w.remove(eid,MeshMaterial);w.add(eid,MeshMaterial,white);}
 let first,maxChanged=0,occupied=0;
 const yawBefore=w.storage(LocalPlayer).viewYaw.get(s.player);
 for(let frame=0;frame<48;frame++){
  pointerLockChanged(w,true);pointerMove(w,{x:0,y:0,deltaX:4});w.step(1/144);
  const rgba=(await captureTexture(w,s.camera)).rgba;
  const silhouette=new Uint8Array(640*360);
  for(let i=0;i<silhouette.length;i++)silhouette[i]=Number(rgba[i*4]>100);
  if(!first){first=silhouette;occupied=silhouette.reduce((a,b)=>a+b,0);}
  else {let changed=0;for(let i=0;i<first.length;i++)changed+=Number(first[i]!==silhouette[i]);maxChanged=Math.max(maxChanged,changed);}
 }
 return {maxChanged,occupied,turn:w.storage(LocalPlayer).viewYaw.get(s.player)-yawBefore};
};
window.adapter=w.gpu.adapter;window.ready=true;
</script></body></html>
