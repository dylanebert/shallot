<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Walk a first-person sound yard: moving spatial music, pause and resume, a synthesized chime." />
        <title>Sound · Shallot</title>
        <link rel="stylesheet" href="./src/touch.css" />
        <link rel="stylesheet" href="./src/hud.css" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <style>html, body { margin: 0; width: 100%; height: 100%; background: #141210; }
            canvas { display: block; width: 100%; height: 100%; }
            [data-shallot-bootstrap] { position: fixed; inset: 0; display: grid; place-items: center; background: #1c1917; color: #f0e6d6; font: 400 13px/20px 'IBM Plex Sans', system-ui, sans-serif; }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div data-shallot-bootstrap data-state="loading" role="status">Loading…</div>
        <script src="/startup.js"></script>
        <script type="module">
            import { runApp, shallotDark } from "@dylanebert/shallot";
            import { YardPlugin } from "./src/yard";
            import { hud } from "./src/hud";

            const bootstrap = document.querySelector("[data-shallot-bootstrap]");
            await runApp({ plugins: [YardPlugin], ui: hud, loading: shallotDark({ bootstrap }) });
        </script>
    </body>
</html>
