<!doctype html><html><head><link rel="stylesheet" href="../src/touch.css"><link rel="stylesheet" href="../src/hud.css"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;background:#141210}canvas{display:block;width:100%;height:100%}</style></head><body><canvas></canvas><script type="module">
import { createApp, DirectionalLight, PointLight, SpotLight, mountOverlay, Transform, Devices, GroundState } from '@dylanebert/shallot';
import { PhysicsWorldDefinition } from '@dylanebert/shallot/standard/physics';
import { Yard } from '../src/yard';
import { Sliding, Hint } from '../src/sound';
import { Character, setTransform, Sound } from '@dylanebert/shallot';
import { LocalPlayer, Player, PlayerInput } from '../src/player';
import { YardPlugin } from '../src/yard';
import { hud } from '../src/hud';
// The checks read input and DOM state, not pixels, and rebuild the game for each claim.
const start = async () => {
 const app = await createApp({plugins:[YardPlugin], pixelRatio:0.05, setup(world){
  world.resource(PhysicsWorldDefinition).workerCount=1;
  // Input and DOM checks do not read shadow pixels.
  for(const type of [DirectionalLight,PointLight,SpotLight])
   for(const eid of world.query([type])) world.storage(type).shadowMapsEnabled.set(eid,0);
 }});
 const dispose = hud(mountOverlay(document.querySelector('canvas'), app.world), app.world);
 app.world.onDispose(dispose);
 // Bind canvas input before the first touch.
 app.world.step(1/60);
 return app;
};
let app;
window.reset = async () => { app?.dispose(); app = await start(); };
window.aimUse = () => {
 const w = app.world, yard = w.resource(Yard);
 w.remove(yard.speaker,Sliding);
 setTransform(w, yard.player, [w.storage(Transform).translation.x.get(yard.speaker),0.7,0.4], [0,0,0,1]);
 w.storage(LocalPlayer).viewYaw.set(yard.player,0);
 w.storage(LocalPlayer).viewPitch.set(yard.player,0);
 w.storage(Character).velocity.set(yard.player,0,0,0,0);
 w.storage(Player).gravity.set(yard.player,0);
 w.storage(Player).friction.set(yard.player,1000);
};
window.useState = () => app.world.storage(Sound).paused.get(app.world.resource(Yard).speaker);
window.useReady = () => !!app.world.resource(Hint).action;
// Steps sample input and draw; ticks advance only fixed simulation, from the last sampled input.
window.sample = (steps = 0, ticks = 0) => {
 const world = app.world;
 for (let i = 0; i < steps; i++) world.step(1 / 60);
 for (let i = 0; i < ticks; i++) world.tick();
 const eid = [...world.query([Player])][0];
 const t = world.storage(Transform).translation.column;
 const input = world.storage(PlayerInput);
 return {grounded: world.storage(Character).groundState.get(eid) === GroundState.OnGround, position: Array.from(t.slice(eid*4,eid*4+3)), yaw:input.yaw.get(eid), jumps:input.jumpPresses.get(eid), use:world.resource(Devices).keys.held.has('KeyE')};
};
</script></body></html>
