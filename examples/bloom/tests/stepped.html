<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>bloom, stepped</title>
        <style>
            * { box-sizing: border-box; margin: 0; }
            html, body, canvas { width: 100%; height: 100%; }
            body { overflow: hidden; background: #191816; }
            canvas { display: block; }
        </style>
    </head>
    <body>
        <canvas width="1280" height="720"></canvas>
        <script type="module">
            import { Camera, createApp, mountOverlay } from "@dylanebert/shallot";
            import { flushSync } from "svelte";
            import { hud } from "../src/hud";
            import { ScenePlugin } from "../src/scene";

            const canvas = document.querySelector("canvas");
            const app = await createApp({ plugins: [ScenePlugin] });
            // Controls checks read focus and orbit yaw, not pixels; without a Camera a step draws nothing,
            // and input stays bound to the canvas.
            if (new URL(location.href).searchParams.has("controls"))
                for (const eid of [...app.world.query([Camera])]) app.world.remove(eid, Camera);
            const { Orbit } = await import("@dylanebert/shallot/extras");
            window.controlsKey = () => {
                app.world.step(1 / 60);
                const camera = [...app.world.query([Orbit])][0];
                return app.world.storage(Orbit).yaw.get(camera);
            };
            const { Bloom } = await import("@dylanebert/shallot/bloom");
            const { settings } = await import("../src/settings");
            const { Scene } = await import("../src/scene");
            window.bloomFields = () => {
                const camera = app.world.resource(Scene).camera;
                if (!app.world.has(camera, Bloom)) return null;
                const bloom = app.world.storage(Bloom);
                const fields = { compositeMode: bloom.compositeMode.get(camera) };
                for (const { field } of settings)
                    fields[field] = field === "scale" ? bloom.scale.x.get(camera) : bloom[field].get(camera);
                return fields;
            };
            hud(mountOverlay(canvas, app.world), app.world);
            flushSync();
        </script>
    </body>
</html>
