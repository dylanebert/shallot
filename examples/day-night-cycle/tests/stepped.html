<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><title>day-night-cycle, stepped</title><style>body { margin: 0; } canvas { display: block; }</style></head>
<body>
<canvas width="1280" height="720"></canvas>
<script type="module">
    import { createApp, mountOverlay, Transform, lookAtRotation, VolumetricLight } from "@dylanebert/shallot";
    import { attachTexture, captureTexture, captureFrame } from "@dylanebert/shallot/rendering";
    import { NoFog } from "@dylanebert/shallot/extras";
    import { flushSync } from "svelte";
    import { hud } from "../src/hud";
    import { Clock, CycleScene, CyclePlugin } from "../src/cycle";
    const canvas = document.querySelector("canvas");
    const startHour = Number(new URL(location.href).searchParams.get("hour") ?? 10);
    const app = await createApp({ plugins: [{ ...CyclePlugin, initialize(world) {
        world.resource(Clock).hour = startHour;
        CyclePlugin.initialize(world);
    } }] });
    const fullSize = new URL(location.href).searchParams.has("capture");
    const camera = app.world.resource(CycleScene).camera;
    if (new URL(location.href).searchParams.has("evening") || new URL(location.href).searchParams.has("side")) {
        const { Orbit } = await import("@dylanebert/shallot/extras");
        const yaw = new URL(location.href).searchParams.has("side") ? 0 : 1.8;
        app.world.storage(Orbit).yaw.set(camera, yaw);
        const x = 12 * Math.cos(0.18) * Math.sin(yaw), y = 12 * Math.sin(0.18), z = 12 * Math.cos(0.18) * Math.cos(yaw);
        app.world.storage(Transform).translation.set(camera, x, y, z);
        app.world.storage(Transform).rotation.set(camera, ...lookAtRotation(x, y, z, 0, 0, 0));
    }
    if (!fullSize) attachTexture(app.world, camera, { width: 256, height: 144 });
    if (new URL(location.href).searchParams.has("no-shafts")) app.world.remove(app.world.resource(CycleScene).sun, VolumetricLight);
    app.world.tick();
    hud(mountOverlay(canvas, app.world), app.world);
    flushSync();
    window.frame = async (hour, noFog = false) => {
        if (noFog && !app.world.has(camera, NoFog)) app.world.add(camera, NoFog);
        else if (!noFog) app.world.remove(camera, NoFog);
        if (hour !== undefined) app.world.resource(Clock).hour = hour;
        const capture = fullSize ? captureFrame(canvas) : undefined;
        app.world.step(0);
        flushSync();
        const image = await (capture ?? captureTexture(app.world, camera));
        const copy = document.createElement("canvas");
        copy.width = image.width; copy.height = image.height;
        copy.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(image.rgba), image.width, image.height), 0, 0);
        const small = document.createElement("canvas");
        small.width = 320; small.height = 180;
        const context = small.getContext("2d");
        context.drawImage(copy, 0, 0, small.width, small.height);
        return { hour: app.world.resource(Clock).hour, width: small.width, height: small.height, rgba: Array.from(context.getImageData(0, 0, small.width, small.height).data), png: copy.toDataURL() };
    };
</script>
</body></html>
