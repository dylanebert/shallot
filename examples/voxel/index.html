<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Scroll over seeded voxel hills with scattered grass, flowers, rocks and trees as GPU-meshed chunks stream into and out of view." />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <title>voxel</title>
        <style>body, body * { user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-drag: none; cursor: default; }
            html, body { margin: 0; width: 100%; height: 100%; background: #89b6e9; }
            canvas { display: block; width: 100%; height: 100%; }
            [data-shallot-bootstrap] { position: fixed; inset: 0; display: grid; place-items: center; background: #1c1917; color: #f0e6d6; font: 400 13px/20px 'IBM Plex Sans', system-ui, sans-serif; }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div data-shallot-bootstrap data-state="loading" role="status">Loading…</div>
        <script src="/startup.js"></script>
        <script type="module">
            import { runApp, shallotDark } from "@dylanebert/shallot";
            import { AppPlugin } from "./src/app";

            const bootstrap = document.querySelector("[data-shallot-bootstrap]");
            await runApp({ plugins: [AppPlugin], loading: shallotDark({ bootstrap }) });
        </script>
    </body>
</html>
