<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>post-processing, stepped</title>
        <style>
            * { box-sizing: border-box; margin: 0; }
            html, body, canvas { width: 100%; height: 100%; }
            body { overflow: hidden; background: #191816; }
            canvas { display: block; }
        </style>
    </head>
    <body>
        <canvas width="1280" height="720"></canvas>
        <script type="module">
            import { createApp, mountOverlay, DirectionalLight, PointLight, SpotLight } from "@dylanebert/shallot";
            import { captureFrame } from "@dylanebert/shallot/rendering";
            import { flushSync } from "svelte";
            import { hud } from "../src/hud";
            import { ScenePlugin } from "../src/scene";

            const canvas = document.querySelector("canvas");
            // Controls checks read game state and the DOM; a low pixel ratio keeps each stepped draw cheap.
            const controls = new URL(location.href).searchParams.has("controls");
            const pixelRatio = controls ? 0.05 : "auto";
            const app = await createApp({ plugins: [ScenePlugin], pixelRatio, setup(world) {
                if (controls) for (const type of [DirectionalLight, PointLight, SpotLight])
                    for (const eid of world.query([type])) world.storage(type).shadowMapsEnabled.set(eid, 0);
            } });
            const { Orbit } = await import("@dylanebert/shallot/extras");
            window.controlsKey = () => {
                app.world.step(1 / 60);
                const camera = [...app.world.query([Orbit])][0];
                return app.world.storage(Orbit).yaw.get(camera);
            };
            hud(mountOverlay(canvas, app.world), app.world);
            flushSync();
            window.captureScene = async () => {
                flushSync();
                const pending = captureFrame(canvas);
                app.world.step(1 / 60);
                const image = await pending;
                return Array.from(image.rgba);
            };
        </script>
    </body>
</html>
