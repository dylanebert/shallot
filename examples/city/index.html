<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="A seeded city assembled from shared building parts, with an orbit and fly camera." />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <title>city</title>
        <style>
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/plex/IBMPlexSans-Regular-Latin1.woff2') format('woff2'); }
            * { box-sizing: border-box; margin: 0; }
            html, body, canvas { width: 100%; height: 100%; }
            body { overflow: hidden; background: #141210; }
            canvas { display: block; }
            [data-shallot-bootstrap] { position: fixed; inset: 0; display: grid; place-items: center; background: #1c1917; color: #f0e6d6; font: 400 13px/20px 'IBM Plex Sans', system-ui, sans-serif; }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div data-shallot-bootstrap data-state="loading" role="status">Loading…</div>
        <script src="/startup.js"></script>
        <script type="module">
            import { runApp, shallotDark } from "@dylanebert/shallot";
            import { AppPlugin } from "./src/app";

            const bootstrap = document.querySelector("[data-shallot-bootstrap]");
            await runApp({ plugins: [AppPlugin], loading: shallotDark({ bootstrap }) });
        </script>
    </body>
</html>
