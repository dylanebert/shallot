<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="A seeded city assembled from shared building parts, with an orbit and fly camera." />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <title>city</title>
        <style>
            * { box-sizing: border-box; margin: 0; }
            html, body, canvas { width: 100%; height: 100%; }
            body { overflow: hidden; background: #191816; }
            canvas { display: block; }
            [data-shallot-bootstrap] { position: fixed; inset: 0; display: grid; place-items: center; background: #282622; color: #eee9df; font: 400 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div data-shallot-bootstrap data-state="loading" role="status">Loading…</div>
        <script src="/startup.js"></script>
        <script type="module">
            import { runApp, shallotDark } from "@dylanebert/shallot";
            import { CityPlugin } from "./src/city";

            const bootstrap = document.querySelector("[data-shallot-bootstrap]");
            await runApp({ plugins: [CityPlugin], loading: shallotDark({ bootstrap }) });
        </script>
    </body>
</html>
