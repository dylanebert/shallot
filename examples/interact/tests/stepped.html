<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><title>Interact, stepped</title>
<style>body{margin:0;background:#1c1917}canvas{display:block}</style><link rel="stylesheet" href="../src/hud.css"/></head>
<body><canvas width="1280" height="720"></canvas>
<script type="module">
import { Camera, createApp, mountOverlay, Transform, Outline,  pressKey, releaseKey, setTransform, pointerMove, pointerLockChanged } from '@dylanebert/shallot';
import { attachView, attachTexture, detachView, captureTexture, captureFrame } from '@dylanebert/shallot/rendering';
import { PointShadows } from '@dylanebert/shallot/standard/rendering';
import { Room, RoomPlugin } from '../src/room';
import { LocalPlayer, Player } from '../src/player';
import { InteractionInput, Usable, Hint } from '../src/interact';
import { hud } from '../src/hud';
const app = await createApp({plugins:[RoomPlugin]});
const world = app.world;
const room = world.resource(Room);
const canvas = document.querySelector('canvas');
let hudOnly = new URLSearchParams(location.search).has('hud');
const captures = new URLSearchParams(location.search).has('captures');
// Checks read a small final texture, as first-person does; manual PNGs retain the game's full canvas.
if (!captures) {
 canvas.width=320; canvas.height=180;
 if(hudOnly) attachView(world,room.camera);
 else attachTexture(world, room.camera, {width:320, height:180});
 world.storage(Camera).antialias.set(room.camera,0);
 world.resource(PointShadows).atlas=512;
 world.resource(PointShadows).casters=1;
}
window.view=(pixels)=>{
 if(captures)return;
 detachView(world,room.camera);hudOnly=!pixels;
 if(pixels)attachTexture(world,room.camera,{width:320,height:180});else attachView(world,room.camera);
};
hud(mountOverlay(canvas, world), world);
// The check places the same player, leaving the controller to pose its camera.
window.aim = (index, distance=2.6, yaw=0, pitch=0) => {
 const t = world.storage(Transform);
 const target = room.targets[index];
 const x=t.translation.x.get(target), y=t.translation.y.get(target), z=t.translation.z.get(target);
 const px=x+Math.sin(yaw)*Math.cos(pitch)*distance, py=y+Math.sin(pitch)*distance-0.7, pz=z+Math.cos(yaw)*Math.cos(pitch)*distance;
 setTransform(world, room.player, [px,py,pz], [0,0,0,1]);
 world.storage(LocalPlayer).viewYaw.set(room.player,yaw);
 world.storage(LocalPlayer).viewPitch.set(room.player,-pitch);
 world.storage(Player).gravity.set(room.player,0);
 world.storage(Player).friction.set(room.player,1000);
 world.step(1/60);
 world.step(1/60);
};
window.key = (down) => { (down?pressKey:releaseKey)(world,'KeyE'); };
window.advance = (count=1) => {
 world.step(1/60);
 // Sample the input once, then advance the hold without drawing every fixed tick.
 for(let i=1;i<count;i++) world.tick();
 if(count>1) world.step(0);
 return window.state();
};
window.state = () => ({
 targets:room.targets.map(eid=>({outlined:world.has(eid,Outline), active:world.storage(Usable).active.get(eid), height:world.storage(Transform).translation.y.get(eid)})),
 prompt:Number(!!world.resource(Hint).target),
 ticks:world.storage(InteractionInput).ticks.get(room.camera),
});
async function render() {
 if (canvas.width===320) { world.step(0); return captureTexture(world, room.camera); }
 const pending=captureFrame(canvas); world.step(0); return pending;
}
window.capture = async () => {
 const image=await render();
 const canvas=document.createElement('canvas'); canvas.width=image.width; canvas.height=image.height;
 canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(image.rgba),image.width,image.height),0,0);
 return canvas.toDataURL('image/png');
};
window.adapter = world.gpu.adapter;
window.turnAway = () => {
 pointerLockChanged(world,true);
 pointerMove(world,{x:0,y:0,deltaX:Math.PI*1080/1.5});
};
window.overview = () => {
 setTransform(world,room.player,[0,1,2],[0,0,0,1]);
 world.storage(LocalPlayer).viewYaw.set(room.player,0);
 world.storage(LocalPlayer).viewPitch.set(room.player,0);
 world.step(1/60); world.step(1/60);
};
window.evidence = async () => {
 const on=(await render()).rgba;
 const outlined=room.targets.find(eid=>world.has(eid,Outline));
 if (!outlined) throw new Error('evidence needs a focused target');
 world.storage(Outline).width.set(outlined,0);
 const off=(await render()).rgba;
 world.storage(Outline).width.set(outlined,4);
 const count=(a,b,x0,y0,x1,y1)=>{
  let changed=0;
  const scale=canvas.width/1280;
  for(let y=Math.floor(y0*scale);y<y1*scale;y++) for(let x=Math.floor(x0*scale);x<x1*scale;x++) {
   const i=(y*canvas.width+x)*4;
   if(Math.max(Math.abs(a[i]-b[i]),Math.abs(a[i+1]-b[i+1]),Math.abs(a[i+2]-b[i+2]))>15) changed++;
  }
  return changed;
 };
 return {outline:count(on,off,400,0,810,720)};
};
window.lampEvidence = async () => {
 const off=(await render()).rgba;
 window.key(true); window.advance();
 const on=(await render()).rgba;
 let changed=0, increase=0;
 // Bare back wall, above and left of the lamp: no prompt, outline or moving object.
 const scale=canvas.width/1280;
 for(let y=100*scale;y<280*scale;y++) for(let x=100*scale;x<500*scale;x++) {
  const i=(y*canvas.width+x)*4;
  const delta=(on[i]+on[i+1]+on[i+2]-off[i]-off[i+1]-off[i+2])/3;
  if(delta>8) changed++;
  increase+=delta;
 }
 return {changed:changed/(400*180*scale*scale), increase:increase/(400*180*scale*scale)};
};
window.holdEvidence = async () => {
 if(hudOnly)window.view(true);
 window.aim(2);
 const target=room.targets[2], t=world.storage(Transform);
 const position=()=>[t.translation.x.get(target),t.translation.y.get(target),t.translation.z.get(target)];
 const beforePosition=position();
 const before=(await render()).rgba;
 window.key(true); window.advance(60);
 const after=(await render()).rgba;
 let changed=0;
 const scale=canvas.width/1280;
 for(let y=Math.floor(330*scale);y<Math.floor(390*scale);y++) for(let x=Math.floor(610*scale);x<Math.floor(670*scale);x++) {
  const i=(y*canvas.width+x)*4;
  if(Math.abs(before[i]-after[i])+Math.abs(before[i+1]-after[i+1])+Math.abs(before[i+2]-after[i+2])>20) changed++;
 }
 return {beforePosition,afterPosition:position(),changed:changed/(3600*scale*scale)};
};
window.ready=true;
</script></body></html>
