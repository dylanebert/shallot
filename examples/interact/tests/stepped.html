<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><title>Interact, stepped</title>
<style>body{margin:0;background:#1c1917}canvas{display:block}</style></head>
<body><canvas width="1280" height="720"></canvas>
<script type="module">
import { createApp, Transform, Outline, Text, Sprite, pressKey, releaseKey, setInputEnabled, setTransform, pointerMove, pointerLockChanged } from '@dylanebert/shallot';
import { captureFrame } from '@dylanebert/shallot/rendering';
import { Room, RoomPlugin } from '../src/room';
import { LocalPlayer, Player } from '../src/player';
import { InteractionInput, Usable, Prompt } from '../src/interact';
const app = await createApp({plugins:[RoomPlugin]});
const world = app.world;
const room = world.resource(Room);
// The check places the same player, leaving the controller to pose its camera.
window.aim = (index, distance=2.6) => {
 const t = world.storage(Transform);
 const target = room.targets[index];
 const x=t.translation.x.get(target), y=t.translation.y.get(target), z=t.translation.z.get(target);
 setTransform(world, room.player, [x,y-0.7,z+distance], [0,0,0,1]);
 t.translation.set(room.player,x,y-0.7,z+distance);
 world.storage(LocalPlayer).viewYaw.set(room.player,0);
 world.storage(LocalPlayer).viewPitch.set(room.player,0);
 world.storage(Player).gravity.set(room.player,0);
 world.storage(Player).friction.set(room.player,1000);
 world.step(1/60);
 world.step(1/60);
 world.step(0);
};
window.key = (down) => { setInputEnabled(world,true); (down?pressKey:releaseKey)(world,'KeyE'); };
window.advance = (count=1) => { for(let i=0;i<count;i++) world.step(1/60); return window.state(); };
window.state = () => ({
 targets:room.targets.map(eid=>({outlined:world.has(eid,Outline), active:world.storage(Usable).active.get(eid), height:world.storage(Transform).translation.y.get(eid)})),
 prompt:world.storage(Sprite).visible.get(room.prompt),
 ticks:world.storage(InteractionInput).ticks.get(room.camera),
});
window.capture = async () => {
 const pending=captureFrame(document.querySelector('canvas')); world.step(0); const image=await pending;
 const canvas=document.createElement('canvas'); canvas.width=image.width; canvas.height=image.height;
 canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(image.rgba),image.width,image.height),0,0);
 return canvas.toDataURL('image/png');
};
window.adapter = world.gpuIfAvailable.adapter;
window.turnAway = () => {
 setInputEnabled(world,true); pointerLockChanged(world,true);
 pointerMove(world,{x:0,y:0,deltaX:Math.PI*1080/1.5});
};
window.overview = () => {
 setTransform(world,room.player,[0,1,3],[0,0,0,1]);
 world.storage(LocalPlayer).viewYaw.set(room.player,0);
 world.storage(LocalPlayer).viewPitch.set(room.player,0);
 world.step(1/60); world.step(1/60);
};
window.evidence = async () => {
 const render = async () => { const pending=captureFrame(document.querySelector('canvas')); world.step(0); return (await pending).rgba; };
 const on=await render();
 const outlined=room.targets.find(eid=>world.has(eid,Outline));
 if (!outlined) throw new Error('evidence needs a focused target');
 world.storage(Outline).width.set(outlined,0);
 const off=await render();
 world.storage(Outline).width.set(outlined,4);
 const p=world.storage(Prompt);
 const key=p.key.get(room.prompt), label=p.label.get(room.prompt), ring=p.ring.get(room.prompt);
 world.storage(Sprite).opacity.set(room.prompt,0); world.storage(Sprite).opacity.set(ring,0);
 world.storage(Text).opacity.set(key,0); world.storage(Text).opacity.set(label,0);
 const noPrompt=await render();
 world.storage(Sprite).opacity.set(room.prompt,1); world.storage(Sprite).opacity.set(ring,1);
 world.storage(Text).opacity.set(key,1); world.storage(Text).opacity.set(label,1);
 const count=(a,b,x0,y0,x1,y1)=>{
  let changed=0;
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++) {
   const i=(y*1280+x)*4;
   if(Math.max(Math.abs(a[i]-b[i]),Math.abs(a[i+1]-b[i+1]),Math.abs(a[i+2]-b[i+2]))>15) changed++;
  }
  return changed;
 };
 return {outline:count(on,off,400,0,810,720), prompt:count(on,noPrompt,810,280,1200,440)};
};
window.ready=true;
</script></body></html>
