<!doctype html>
<html lang="en"><head><base href="/"><meta charset="utf-8"><title>Shallot capture</title>
<style>html,body{margin:0;width:960px;height:720px}canvas{display:block;width:100%;height:100%}</style></head><body>
<canvas id="canvas"></canvas>
<script type="module">
import { runApp, Camera, Transform } from '@dylanebert/shallot';
import { Orbit } from '@dylanebert/shallot/extras';
import { spawnGltfScene } from '@dylanebert/shallot/gltf';
import { AppPlugin, Viewer } from '../src/app';
const params = new URLSearchParams(location.search);
const camera = JSON.parse(params.get('camera'));
await runApp({plugins:[AppPlugin], ui(_container, world) {
    const viewer = world.resource(Viewer);
    for (const entity of viewer.entities) world.destroy(entity);
    world.destroy(viewer.ground);
    viewer.entities = spawnGltfScene(world, viewer.models.get(params.get('scene')));
    world.remove(viewer.camera, Orbit);
    const transform = world.storage(Transform);
    transform.translation.set(viewer.camera, ...camera.position);
    transform.rotation.set(viewer.camera, 0, 0, 0, 1);
    const storage = world.storage(Camera);
    storage.fov.set(viewer.camera, camera.fov);
    storage.near.set(viewer.camera, camera.near);
    storage.far.set(viewer.camera, camera.far);
}});
window.captureReady = true;
</script></body></html>
