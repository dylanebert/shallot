<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="Climb a first-person ascent with steps, a lift, and a block perch." />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="./icon.svg" />
        <title>First Person</title>
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body { background: #0c0a09; overflow: hidden; }
            canvas { display: block; width: 100vw; height: 100vh; }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <script type="module">
            import { PhysicsPlugin, CharacterPlugin, PlayerPlugin, runApp } from "@dylanebert/shallot";
            import { Demo } from "./src/demo";
            await runApp({
                plugins: [PhysicsPlugin, CharacterPlugin, PlayerPlugin, Demo],
            });
        </script>
    </body>
</html>
