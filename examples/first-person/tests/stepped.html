<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><title>First-person, stepped</title><style>body{margin:0;background:#191816}canvas{display:block}</style></head><body><canvas width="1280" height="720"></canvas><script type="module">
import { createApp, Transform } from '@dylanebert/shallot';
import { Text } from '@dylanebert/shallot/extras';
import { attachTexture, captureTexture } from '@dylanebert/shallot/rendering';
import { APP_PLUGINS } from '../src/plugins';
import { Route } from '../src/demo';
import { LocalPlayer, PlayerInput } from '../src/player';
const app=await createApp({plugins:APP_PLUGINS});
const world=app.world, route=world.resource(Route).entities;
attachTexture(world,route.eye,{width:1280,height:720});
window.controlsInk=async()=>{
 world.step(0);
 const before=(await captureTexture(world,route.eye)).rgba;
 const eid=route.controls, values=world.get(eid,Text);
 world.remove(eid,Text);
 world.step(0);
 const hidden=(await captureTexture(world,route.eye)).rgba;
 let ink=0;
 for(let i=0;i<before.length;i+=4)if([0,1,2].some(c=>Math.abs(before[i+c]-hidden[i+c])>20))ink++;
 world.add(eid,Text,values);
 world.step(0);
 return {ink,restored:JSON.stringify(world.get(eid,Text))===JSON.stringify(values)};
};
window.lift=()=>{
 world.storage(Transform).translation.set(route.player,0,3.5,-6.5);
 world.storage(LocalPlayer).viewPitch.set(route.player,-0.55);
 world.storage(PlayerInput).pitch.set(route.player,-0.55);
 world.tick();world.tick();
 world.step(0);
};
window.capture=async()=>{
 world.step(0);
 const frame=await captureTexture(world,route.eye);
 const output=document.createElement('canvas');output.width=frame.width;output.height=frame.height;
 output.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(frame.rgba),frame.width,frame.height),0,0);
 return output.toDataURL('image/png');
};
window.adapter=world.gpu.adapter;
world.step(0);window.ready=true;
</script></body></html>
