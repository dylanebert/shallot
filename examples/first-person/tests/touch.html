<!doctype html><html><head><link rel="stylesheet" href="../src/touch.css"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;background:#141210}canvas{display:block;width:100vw;height:100vh}</style></head><body><canvas></canvas><script type="module">
import { runApp, Transform, Devices, Character, GroundState } from '@dylanebert/shallot';
import { Player, PlayerInput } from '../src/player';
import { AppPlugin } from '../src/app';
import { Route } from '../src/demo';
import { Text, internText } from '@dylanebert/shallot/extras';

const app = await runApp({plugins:[AppPlugin], });
window.hint = (value) => app.world.storage(Text).content.get(app.world.resource(Route).entities.controls) === internText(app.world, value);
window.sample = () => {
 const world = app.world;
 const eid = [...world.query([Player])][0];
 const t = world.storage(Transform).translation.column;
 const input = world.storage(PlayerInput);
 return {grounded: world.storage(Character).groundState.get(eid) === GroundState.OnGround, position: Array.from(t.slice(eid*4,eid*4+3)), yaw:input.yaw.get(eid), jumps:input.jumpPresses.get(eid), use:world.resource(Devices).keys.held.has('KeyE')};
};
</script></body></html>
