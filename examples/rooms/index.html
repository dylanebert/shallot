<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="Quick-join a first-person room, invite a friend by code, and rejoin as the same player." />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <link rel="stylesheet" href="./src/touch.css" />
        <link rel="stylesheet" href="./src/rooms.css" />
        <title>rooms</title>
        <style>
            * { box-sizing: border-box; }
            html, body, canvas { width: 100%; height: 100%; margin: 0; }
            body { background: #141210; overflow: hidden; }
            canvas { display: block; }
            [data-shallot-bootstrap] { position: fixed; inset: 0; display: grid; place-items: center; background: #1c1917; color: #f0e6d6; font: 400 13px/20px 'IBM Plex Sans', system-ui, sans-serif; }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div data-shallot-bootstrap data-state="loading" role="status">Loading…</div>
        <aside class="ec" aria-label="Rooms" hidden>
            <section class="controls" id="lobby" aria-label="Join a room">
                <div class="fields">
                    <div class="section">
                        <button id="quick" tabindex="-1">Quick join</button>
                        <button id="create" tabindex="-1">Create private room</button>
                        <button id="enter" tabindex="-1" aria-expanded="false" aria-controls="join"><span>Enter code</span></button>
                        <form id="join" hidden>
                            <input id="code" type="text" tabindex="-1" aria-label="Room code" placeholder="Room code" autocomplete="off" autocapitalize="characters" spellcheck="false" required />
                            <button tabindex="-1">Join</button>
                        </form>
                    </div>
                </div>
            </section>
            <section id="session" aria-label="Current room" hidden>
                <ul id="players" aria-label="Party slots"></ul>
                <div id="room-actions">
                    <button id="copy" tabindex="-1" aria-label="Copy room code" aria-describedby="room-code" title="Copy room code" hidden><span id="room-code"></span></button>
                    <button id="drop" tabindex="-1" aria-label="Drop connection" title="Drop connection" aria-pressed="false" hidden></button>
                    <button id="leave" tabindex="-1" aria-label="Leave" title="Leave"></button>
                </div>
                <span id="copy-feedback" role="status"></span>
            </section>
            <p id="status" role="status" hidden></p>
        </aside>
        <script src="/startup.js"></script>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
