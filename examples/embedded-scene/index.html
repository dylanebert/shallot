<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="Show a Shallot scene inside a host page, its loading contained to the frame." />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Embedded Shallot scene</title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <div id="app">
            <main class="page">
                <p class="description">scene with minimal loading bar</p>
                <section class="scene" aria-label="Embedded Shallot scene">
                    <div class="frame" id="frame">
                        <canvas id="scene" aria-label="Rendered Shallot scene"></canvas>
                        <div
                            data-shallot-bootstrap
                            data-state="loading"
                            role="status"
                            aria-label="Loading"
                        >
                            <span data-bootstrap-label>Loading…</span>
                            <span data-bootstrap-track aria-hidden="true"></span>
                        </div>
                    </div>
                </section>
            </main>
        </div>
        <script src="/startup.js"></script>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
