<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>tonemapping, stepped</title>
        <style>
            * { box-sizing: border-box; margin: 0; }
            html, body, canvas { width: 100%; height: 100%; }
            body { overflow: hidden; background: #191816; }
            canvas { display: block; }
        </style>
    </head>
    <body>
        <canvas width="1280" height="720"></canvas>
        <script type="module">
            import { Camera, createApp, MeshInstance, mountOverlay, Tonemapping } from "@dylanebert/shallot";
            import { captureFrame } from "@dylanebert/shallot/rendering";
            import { flushSync } from "svelte";
            import { hud } from "../src/hud";
            import { Scene, ScenePlugin } from "../src/scene";

            const canvas = document.querySelector("canvas");
            canvas.width = innerWidth;
            canvas.height = innerHeight;
            const app = await createApp({ plugins: [ScenePlugin] });
            // Controls checks read focus, orbit yaw and fields, not pixels; without a Camera a step draws
            // nothing, and input stays bound to the canvas.
            if (new URL(location.href).searchParams.has("controls"))
                for (const eid of [...app.world.query([Camera])]) app.world.remove(eid, Camera);
            const { Orbit } = await import("@dylanebert/shallot/extras");
            window.controlsKey = () => {
                app.world.step(1 / 60);
                return app.world.storage(Orbit).yaw.get(app.world.resource(Scene).camera);
            };
            window.tonemappingFields = () => {
                const { camera, subjects, pattern } = app.world.resource(Scene);
                return {
                    method: app.world.storage(Tonemapping).method.get(camera),
                    pattern: app.world.has(pattern, MeshInstance),
                    subjects: subjects.filter((eid) => app.world.has(eid, MeshInstance)).length,
                };
            };
            hud(mountOverlay(canvas, app.world), app.world);
            flushSync();
            app.world.step(0);
            app.world.step(0);
            window.captureScene = async () => {
                flushSync();
                const pending = captureFrame(canvas);
                app.world.step(0);
                const image = await pending;
                return Array.from(image.rgba);
            };
        </script>
    </body>
</html>
