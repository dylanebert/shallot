<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="Override the default loading screen: the pre-import bootstrap and the runtime screen." />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <title>Shallot — custom loading screen</title>
        <style>
            * { box-sizing: border-box; margin: 0; }
            html, body, canvas { width: 100%; height: 100%; }
            body { overflow: hidden; background: #f7f3ec; }
            canvas { display: block; }
            [data-shallot-bootstrap] { position: fixed; inset: 0; display: grid; place-items: center; background: #f7f3ec; color: #2a231e; font: 14px system-ui, sans-serif; }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div data-shallot-bootstrap data-state="loading" role="status">Starting…</div>
        <script src="/startup.js"></script>
        <script type="module">
            import { minimalLight, runApp } from "@dylanebert/shallot";
            import { Welcome } from "./src/welcome";

            const bootstrap = document.querySelector("[data-shallot-bootstrap]");
            await runApp({ plugins: [Welcome], loading: minimalLight({ bootstrap }) });
        </script>
    </body>
</html>
