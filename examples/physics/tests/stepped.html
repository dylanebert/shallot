<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Physics grab, stepped</title>
<style>body{margin:0}canvas{width:640px;height:480px;display:block}</style></head>
<body><canvas width="640" height="480"></canvas><script type="module">
import { createApp, MeshPlugin, Body, MotorJoint, Transform, NotShadowCaster, Camera, Devices, Outline, GlobalTransform, pointerMove, pressButton, releaseButton, StandardPhysicsPlugin } from '@dylanebert/shallot';
import { captureFrame, worldToViewport } from '@dylanebert/shallot/rendering';
import { LinesPlugin, OrbitPlugin } from '@dylanebert/shallot/extras';
import { createScene } from '../src/scenes';
import { createViewer, GrabFeedback } from '../src/view';
import { Grab, GrabPlugin } from '../src/grab';
const params=new URLSearchParams(location.search);
const scene=params.get('scene') || 'boxStack';
const bodyIndex=scene==='bridge'?10:scene==='boxStack'?20:0;
let bodies;
const app = await createApp({ plugins: [StandardPhysicsPlugin, LinesPlugin, OrbitPlugin, GrabPlugin, {name:'SampleView', dependencies:[MeshPlugin], initialize(world){createViewer(world)(world,scene)}}], setup(world) {
 bodies=createScene(world,scene);
} });
const world=app.world;
const camera=[...world.query([Camera])][0];
world.storage(Camera).antialias.set(camera,0);
const frame=()=>world.step(1/60);
await frame(); await frame();
const position=(eid)=>{const p=world.storage(GlobalTransform).translation;return [p.x.get(eid),p.y.get(eid),p.z.get(eid)]};
const pose=(eid)=>{const q=world.storage(GlobalTransform).rotation;return {translation:position(eid),rotation:[q.x.get(eid),q.y.get(eid),q.z.get(eid),q.w.get(eid)]}};
window.marker=()=>world.resource(GrabFeedback).marker;
window.drag=async(move=true)=>{
 const body=bodies[bodyIndex];
 const before=position(body);
 const cameraBefore=pose(camera);
 const pixel=worldToViewport(world,camera,before);
 pointerMove(world,{x:pixel[0],y:pixel[1],deltaX:3,deltaY:2}); pressButton(world,'left');
 await frame();
 const cameraDuring=[pose(camera)];
 const picked=world.resource(Grab).body;
 if(move) for(let i=1;i<=30;i++) {pointerMove(world,{x:pixel[0]+(i===30?170:i*3),y:pixel[1],deltaX:3});await frame();cameraDuring.push(pose(camera));}
 const after=position(body);
 const grab=world.resource(Grab);
 const a=world.storage(MotorJoint).localAnchorB;
 const anchor=[a.x.get(grab.joint),a.y.get(grab.joint),a.z.get(grab.joint)];
 const bodyPose=pose(grab.body);
 const q=bodyPose.rotation;
 const [x,y,z,w]=q;
 const [ax,ay,az]=anchor;
 const attachment=[
 (1-2*y*y-2*z*z)*ax+(2*x*y-2*w*z)*ay+(2*x*z+2*w*y)*az,
 (2*x*y+2*w*z)*ax+(1-2*x*x-2*z*z)*ay+(2*y*z-2*w*x)*az,
 (2*x*z-2*w*y)*ax+(2*y*z+2*w*x)*ay+(1-2*x*x-2*y*y)*az
 ].map((v,i)=>v+bodyPose.translation[i]);
 const projected=worldToViewport(world,camera,after);
 const marker=world.resource(GrabFeedback).marker;
 const scale=world.storage(Transform).scale.x.get(marker);
 const cq=pose(camera).rotation;
 const up=[2*(cq[0]*cq[1]-cq[3]*cq[2]),1-2*(cq[0]*cq[0]+cq[2]*cq[2]),2*(cq[1]*cq[2]+cq[3]*cq[0])];
 const ends=[-0.5,0.5].map(sign=>worldToViewport(world,camera,attachment.map((v,i)=>v+sign*scale*up[i])));
 const diameter=Math.hypot(ends[1][0]-ends[0][0],ends[1][1]-ends[0][1]);
 const mid=attachment.map((v,i)=>(v+grab.point[i])/2);
 const resize=(width,height)=>{const canvas=document.querySelector('canvas');canvas.width=width;canvas.height=height;canvas.style.width=`${width}px`;canvas.style.height=`${height}px`};
 const read=async(points=[])=>{resize(1280,720);const pending=captureFrame(document.querySelector('canvas'));await world.step(0);const image=await pending;const pixels=points.map(point=>{const pixel=worldToViewport(world,camera,point);const offset=(Math.round(pixel[1])*image.width+Math.round(pixel[0]))*4;return Array.from(image.rgba.slice(offset,offset+3))});resize(640,480);return {image,pixels}};
 let lineSamples;
 if(params.has('capture')) lineSamples=(await read([0.1,0.5,0.9].map(t=>attachment.map((v,i)=>v*(1-t)+grab.point[i]*t)))).pixels;
 const markerDuring=world.has(marker,GlobalTransform) && !world.has(marker, Body);
 window.finishDrag=async()=>{releaseButton(world,'left');await frame();const linePixel=params.has('capture')?(await read([mid])).pixels[0]:undefined;return {...(linePixel?{linePixel}:{}),marker:world.resource(GrabFeedback).marker,mouse:world.resource(Grab).mouse,joint:world.resource(Grab).joint}};
 if(params.has('capture')) window.captureGrab=async()=>{const {image:capture}=await read();const image=document.createElement('canvas');image.width=capture.width;image.height=capture.height;image.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(capture.rgba),capture.width,capture.height),0,0);image.style.cssText='position:absolute;inset:0;width:1280px;height:720px';document.body.append(image)};
 return {attachment,diameter,lineSamples,body,picked,markerDuring,markerNoShadow:world.has(marker,NotShadowCaster),markerPosition:position(marker),target:[...world.resource(Grab).point],before,after,pixel,projected,cameraBefore,cameraDuring,cameraAfter:pose(camera),mouse:world.resource(Grab).mouse,joint:world.resource(Grab).joint};
};
window.emptyDrag=async()=>{
 const before=position(camera);
 const bodyBefore=position(bodies[bodyIndex]);
 pointerMove(world,{x:20,y:20}); pressButton(world,'left'); await frame();
 const picked=world.resource(Grab).body;
 for(let i=1;i<=10;i++){pointerMove(world,{x:20+i*5,y:20,deltaX:5});await frame();}
 releaseButton(world,'left'); await frame();
 return {before,after:position(camera),bodyBefore,bodyAfter:position(bodies[bodyIndex]),picked,mouse:world.resource(Grab).mouse};
};
window.hover=async()=>{
 const body=bodies[bodyIndex];
 const pixel=worldToViewport(world,camera,position(body));
 world.resource(Devices).pointer.hover=true;
 pointerMove(world,{x:pixel[0],y:pixel[1]}); await frame();
 const added=world.has(body,Outline);
 world.resource(Devices).pointer.hover=false; await frame();
 return {added,removed:!world.has(body,Outline)};
};
window.ready=true;
</script></body></html>
