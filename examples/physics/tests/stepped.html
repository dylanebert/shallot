<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Physics grab, stepped</title>
<style>body{margin:0}canvas{width:1280px;height:720px;display:block}</style></head>
<body><canvas width="1280" height="720"></canvas><script type="module">
import { createApp, MeshPlugin, Body, NotShadowCaster, Camera, Devices, Outline, GlobalTransform, pointerMove, pressButton, releaseButton, StandardPhysicsPlugin } from '@dylanebert/shallot';
import { captureFrame, worldToViewport } from '@dylanebert/shallot/rendering';
import { OrbitPlugin } from '@dylanebert/shallot/extras';
import { createScene } from '../src/scenes';
import { createView, GrabFeedback } from '../src/view';
import { Grab, GrabPlugin } from '../src/grab';
let bodies;
const app = await createApp({ plugins: [StandardPhysicsPlugin, OrbitPlugin, GrabPlugin, {name:'SampleView', dependencies:[MeshPlugin], initialize(world){createView(world,'boxStack')}}], setup(world) {
 bodies=createScene(world,'boxStack');
} });
const world=app.world;
const camera=[...world.query([Camera])][0];
world.storage(Camera).antialias.set(camera,0);
const frame=()=>world.step(1/60);
await frame(); await frame();
const position=(eid)=>{const p=world.storage(GlobalTransform).translation;return [p.x.get(eid),p.y.get(eid),p.z.get(eid)]};
const pose=(eid)=>{const q=world.storage(GlobalTransform).rotation;return {translation:position(eid),rotation:[q.x.get(eid),q.y.get(eid),q.z.get(eid),q.w.get(eid)]}};
window.marker=()=>world.resource(GrabFeedback).marker;
window.drag=async()=>{
 const body=bodies[20];
 const before=position(body);
 const cameraBefore=pose(camera);
 const pixel=worldToViewport(world,camera,before);
 pointerMove(world,{x:pixel[0],y:pixel[1],deltaX:3,deltaY:2}); pressButton(world,'left');
 await frame();
 const cameraDuring=[pose(camera)];
 const picked=world.resource(Grab).body;
 for(let i=1;i<=30;i++) {pointerMove(world,{x:pixel[0]+i*3,y:pixel[1],deltaX:3});await frame();cameraDuring.push(pose(camera));}
 const after=position(body);
 const projected=worldToViewport(world,camera,after);
 const marker=world.resource(GrabFeedback).marker;
 const markerDuring=world.has(marker,GlobalTransform) && !world.has(marker, Body);
 window.finishDrag=async()=>{releaseButton(world,'left');await frame();return {marker:world.resource(GrabFeedback).marker,mouse:world.resource(Grab).mouse,joint:world.resource(Grab).joint}};
 window.captureGrab=async()=>{const pending=captureFrame(document.querySelector('canvas'));await frame();const capture=await pending;const image=document.createElement('canvas');image.width=capture.width;image.height=capture.height;image.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(capture.rgba),capture.width,capture.height),0,0);image.style.cssText='position:absolute;inset:0';document.body.append(image)};
 return {body,picked,markerDuring,markerNoShadow:world.has(marker,NotShadowCaster),markerPosition:position(marker),target:[...world.resource(Grab).point],before,after,pixel,projected,cameraBefore,cameraDuring,cameraAfter:pose(camera),mouse:world.resource(Grab).mouse,joint:world.resource(Grab).joint};
};
window.emptyDrag=async()=>{
 const before=position(camera);
 const bodyBefore=position(bodies[20]);
 pointerMove(world,{x:20,y:20}); pressButton(world,'left'); await frame();
 const picked=world.resource(Grab).body;
 for(let i=1;i<=10;i++){pointerMove(world,{x:20+i*5,y:20,deltaX:5});await frame();}
 releaseButton(world,'left'); await frame();
 return {before,after:position(camera),bodyBefore,bodyAfter:position(bodies[20]),picked,mouse:world.resource(Grab).mouse};
};
window.hover=async()=>{
 const body=bodies[20];
 const pixel=worldToViewport(world,camera,position(body));
 world.resource(Devices).pointer.hover=true;
 pointerMove(world,{x:pixel[0],y:pixel[1]}); await frame();
 const added=world.has(body,Outline);
 world.resource(Devices).pointer.hover=false; await frame();
 return {added,removed:!world.has(body,Outline)};
};
window.ready=true;
</script></body></html>
