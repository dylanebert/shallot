<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Physics controls, stepped</title>
<style>body{margin:0}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas width="1280" height="720"></canvas><script type="module">
import { createApp, mountOverlay, StandardPhysicsPlugin, GlobalTransform, DirectionalLight } from '@dylanebert/shallot';
import { PhysicsWorldDefinition } from '@dylanebert/shallot/standard/physics';
import { LinesPlugin, OrbitPlugin, Orbit, TextPlugin } from '@dylanebert/shallot/extras';
import { mount, unmount, flushSync } from 'svelte';
import Hud from '../src/Hud.svelte';
import { EventSample, EventSamplePlugin, SampleInputPlugin } from '../src/events';
import { sceneSwitcher } from '../src/sample';
import { changeControl } from '../src/scenes';
import { BodySamplePlugin } from '../src/bodies';
import { ShapesSamplePlugin } from '../src/shapes';
import { createViewer } from '../src/view';
import { GeometricMoverPlugin } from '../src/geometric-mover';
// The checks read game state and the DOM; a low pixel ratio keeps each stepped draw cheap.
const Viewer={create:createViewer};
const app = await createApp({plugins:[StandardPhysicsPlugin,ShapesSamplePlugin,BodySamplePlugin,GeometricMoverPlugin,EventSamplePlugin,SampleInputPlugin,TextPlugin,OrbitPlugin,LinesPlugin,{name:'SampleViewer',dependencies:[OrbitPlugin],initialize(world){world.resource(Viewer);}}],pixelRatio:0.05,setup(world){world.resource(PhysicsWorldDefinition).workerCount=1;}});
const world=app.world;
const container=mountOverlay(document.querySelector('canvas'),world);
const replace=sceneSwitcher(world,world.resource(Viewer));
let component;
function select(scene){
 const bodies=replace(scene);
 for(const eid of world.query([DirectionalLight]))world.storage(DirectionalLight).shadowMapsEnabled.set(eid,0);
 if(component) void unmount(component);
 component=mount(Hud,{target:container,props:{world,scene,select,change:(name,value,values)=>changeControl(world,scene,bodies,values,name,value)}});
 flushSync();
}
select('revolute');
window.actionSpeed=()=>{
 world.step(1/60);
 return world.storage(GlobalTransform).linearVelocity.x.get(world.resource(EventSample).player);
};
window.controlsKey=()=>{
 world.step(1/60);
 const camera=[...world.query([Orbit])][0];
 return world.storage(Orbit).yaw.get(camera);
};
</script></body></html>
