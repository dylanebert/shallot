<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Physics controls, stepped</title>
<style>html,body{margin:0;width:100%;height:100%}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas width="1280" height="720"></canvas><script type="module">
import { createApp, mountOverlay, StandardPhysicsPlugin, GlobalTransform, DirectionalLight, Resolution } from '@dylanebert/shallot';
import { PhysicsWorldDefinition } from '@dylanebert/shallot/standard/physics';
import { LinesPlugin, OrbitPlugin, Orbit, TextPlugin } from '@dylanebert/shallot/extras';
import { mount, unmount, flushSync } from 'svelte';
import Hud from '../src/Hud.svelte';
import { EventSample, EventSamplePlugin, SampleInputPlugin } from '../src/events';
import { sceneSwitcher } from '../src/sample';
import { changeControl } from '../src/scenes';
import { BodySamplePlugin } from '../src/bodies';
import { ShapesSamplePlugin } from '../src/shapes';
import { createViewer } from '../src/view';
import { VillagePlugin } from '../src/village';
import { GeometricMoverPlugin, GeometricMoverState } from '../src/geometric-mover';
import { DynamicMoverPlugin, DynamicMoverState } from '../src/dynamic-mover-scene';
import { captureFrame } from '@dylanebert/shallot/rendering';
import { RigidBodyPlugin } from '../src/rigid-body';
import { MeshSamplePlugin } from '../src/mesh';
import { CollisionPlugin } from '../src/collision';
import { CollisionDebugPlugin } from '../src/collision-debug';
import { GeometryPlugin } from '../src/geometry';
import { ManifoldPlugin } from '../src/manifold';
import { RobustnessSamplePlugin } from '../src/robustness';
import { WorldSamplePlugin } from '../src/world';
import { DeterminismPlugin } from '../src/determinism';
import { TreeBenchmarkPlugin } from '../src/tree';
import { Grab, GrabPlugin } from '../src/grab';
// The checks read game state and the DOM; a low pixel ratio keeps each stepped draw cheap.
const Viewer={create:createViewer};
const captureMode=new URLSearchParams(location.search).has('capture');
const app = await createApp({plugins:[StandardPhysicsPlugin,GrabPlugin,VillagePlugin,TreeBenchmarkPlugin,DeterminismPlugin,WorldSamplePlugin,RobustnessSamplePlugin,ManifoldPlugin,GeometryPlugin,CollisionPlugin,CollisionDebugPlugin,MeshSamplePlugin,ShapesSamplePlugin,BodySamplePlugin,GeometricMoverPlugin,DynamicMoverPlugin,RigidBodyPlugin,EventSamplePlugin,SampleInputPlugin,TextPlugin,OrbitPlugin,LinesPlugin,{name:'SampleViewer',dependencies:[OrbitPlugin],initialize(world){world.resource(Viewer);}}],pixelRatio:captureMode?1:0.05,setup(world){world.resource(PhysicsWorldDefinition).workerCount=1;}});
const world=app.world;
const container=mountOverlay(document.querySelector('canvas'),world);
const replace=sceneSwitcher(world,world.resource(Viewer));
let component;
function select(scene){
 const bodies=replace(scene);
 if(captureMode)for(const eid of world.query([Orbit]))world.add(eid,Resolution,{height:36});
 for(const eid of world.query([DirectionalLight]))world.storage(DirectionalLight).shadowMapsEnabled.set(eid,0);
 if(component) void unmount(component);
 component=mount(Hud,{target:container,props:{world,scene,select,change:(name,value,values)=>changeControl(world,scene,bodies,values,name,value)}});
 flushSync();
}
select('revolute');
window.actionSpeed=()=>{
 world.step(1/60);
 return world.storage(GlobalTransform).linearVelocity.x.get(world.resource(EventSample).player);
};
window.playerState=(steps=0)=>{
 for(let i=0;i<steps;i++)world.step(1/60);
 const state=world.resource(GeometricMoverState);
 const camera=[...world.query([Orbit])][0];
 return {grabbed:world.resource(Grab).body,position:{...state.mover.position},keys:{...state.keys},yaw:world.storage(Orbit).yaw.get(camera),pan:world.get(camera,Orbit).pan,distance:world.storage(Orbit).distance.get(camera)};
};
window.dynamicState=(steps=0)=>{
 for(let i=0;i<steps;i++)world.step(1/60);
 const state=world.resource(DynamicMoverState);
 return {keys:{...state.keys},balls:state.ballIndex,position:world.get(state.entity,GlobalTransform).translation};
};
window.drawDynamicFrame=async()=>{
 await world.frameFence;
 if(captureMode){
  for(const eid of world.query([Orbit]))world.remove(eid,Resolution);
  world.step(0);await world.frameFence;
  for(const eid of world.query([DirectionalLight]))world.storage(DirectionalLight).shadowMapsEnabled.set(eid,1);
 }
 const pending=captureFrame(document.querySelector('canvas'));
 world.step(0); await world.frameFence;
 const image=await pending;
 const output=document.createElement('canvas');output.width=image.width;output.height=image.height;
 output.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(image.rgba),image.width,image.height),0,0);
 const canvas=document.querySelector('canvas');output.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none';canvas.after(output);
 let cyan=0;for(let i=0;i<image.rgba.length;i+=4)if(image.rgba[i+1]>image.rgba[i]*1.2&&image.rgba[i+2]>image.rgba[i]*1.3)cyan++;
 return {width:image.width,height:image.height,cyan};
};
window.controlsTicks=(ticks)=>{
 for(let i=0;i<ticks;i++)world.tick();
};
window.controlsKey=()=>{
 world.step(1/60);
 const camera=[...world.query([Orbit])][0];
 return world.storage(Orbit).yaw.get(camera);
};
</script></body></html>
